<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#020403"><meta name="description" content="CRYPYKUT — rede social da Colmeia CRYPY."><title>CRYPYKUT · Entre na Colmeia</title>
<style>
:root{color-scheme:dark;--bg:#020403;--line:#1b4930;--green:#00ff88;--ink:#eafff2;--muted:#9bb9a7}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#07351d 0,transparent 52%),var(--bg);color:var(--ink);font:15px/1.5 system-ui,Arial,sans-serif;display:grid;place-items:center;padding:20px}main{width:min(100%,520px)}.brand{text-align:center;margin-bottom:20px}.mark{width:64px;height:64px;margin:0 auto 12px;border-radius:19px;background:var(--green);color:#001b0d;display:grid;place-items:center;font-size:32px;font-weight:1000;box-shadow:0 0 35px #00ff8844}h1{margin:0;font-size:clamp(26px,6vw,38px);letter-spacing:.14em;color:var(--green)}.brand p{color:var(--muted);margin:7px 0}.card{border:1px solid var(--line);border-radius:20px;background:#050b07f2;padding:24px;box-shadow:0 20px 70px #0009}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px}.tabs button,.provider,.submit{border:1px solid #28583b;border-radius:11px;background:#0b1b12;color:var(--ink);padding:12px;font-weight:800}.tabs button[aria-selected=true],.submit{background:#06341d;border-color:var(--green);color:var(--green)}.provider{width:100%;margin:6px 0;display:flex;align-items:center;justify-content:center;gap:10px}.provider:disabled,.submit:disabled{opacity:.45;cursor:not-allowed}label{display:block;color:#c7e8d3;font-size:12px;margin:14px 0 6px}input{width:100%;border:1px solid #28583b;border-radius:10px;background:#020805;color:var(--ink);padding:13px;font:inherit}input:focus-visible,button:focus-visible{outline:2px solid var(--green);outline-offset:3px}.submit{width:100%;margin-top:16px;cursor:pointer}.divider{display:flex;align-items:center;gap:10px;color:#73927e;font-size:11px;margin:15px 0}.divider:before,.divider:after{content:"";height:1px;background:#1b4930;flex:1}#status{min-height:42px;margin-top:12px;color:#f0d98c;font-size:12px;text-align:center}.fine{font-size:11px;color:#789684;text-align:center;margin:16px 0 0}.hidden{display:none!important}
</style></head><body><main><header class="brand"><div class="mark">C</div><h1>CRYPYKUT</h1><p>A rede social da Colmeia · Pessoas, ideias e comunidades</p></header>
<section class="card" aria-label="Acesso à CRYPYKUT"><div class="tabs"><button type="button" id="signinTab" aria-selected="true">Entrar</button><button type="button" id="signupTab" aria-selected="false">Criar conta</button></div>
<button class="provider" id="google" type="button" disabled>◎ Continuar com Google</button><button class="provider" id="microsoft" type="button" disabled>▦ Continuar com Microsoft</button><div class="divider">OU COM SEU E-MAIL</div>
<form id="authForm"><label for="email">E-mail</label><input id="email" type="email" autocomplete="email" required placeholder="voce@exemplo.com"><label for="password">Senha</label><input id="password" type="password" autocomplete="current-password" minlength="8" required placeholder="Mínimo de 8 caracteres"><button class="submit" id="submit" type="submit" disabled>Entrar na CRYPYKUT</button></form>
<div id="status" role="status" aria-live="polite">Aguardando configuração do serviço de autenticação.</div><p class="fine">A conta local usa autenticação do provedor. A senha não é armazenada no HTML.</p></section><p class="fine">CRYPY · WEB3.1 · NEXUS conecta; Sensei conduz</p></main>
<script src="./supabase-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
"use strict";const cfg=window.CRYPYKUT_SUPABASE_CONFIG||{},status=document.getElementById("status"),form=document.getElementById("authForm"),submit=document.getElementById("submit"),google=document.getElementById("google"),microsoft=document.getElementById("microsoft"),signinTab=document.getElementById("signinTab"),signupTab=document.getElementById("signupTab"),password=document.getElementById("password");let mode="signin",client=null;
function say(s){status.textContent=s}function setMode(next){mode=next;signinTab.setAttribute("aria-selected",String(mode==="signin"));signupTab.setAttribute("aria-selected",String(mode==="signup"));submit.textContent=mode==="signin"?"Entrar na CRYPYKUT":"Criar minha conta";password.autocomplete=mode==="signin"?"current-password":"new-password"}
signinTab.addEventListener("click",()=>setMode("signin"));signupTab.addEventListener("click",()=>setMode("signup"));
if(cfg.url&&cfg.anonKey&&window.supabase&&window.supabase.createClient){client=window.supabase.createClient(cfg.url,cfg.anonKey);[submit,google,microsoft].forEach(b=>b.disabled=false);client.auth.getSession().then(({data,error})=>{if(error)say("Não foi possível verificar a sessão.");else if(data.session)location.replace("./rede.html");else say("Escolha Google, Microsoft ou entre com seu e-mail.");});}else say("Configuração pendente: Supabase não conectado. Os botões ficam desativados para não simular login.");
async function oauth(provider){if(!client)return;say("Conectando ao provedor…");const {error}=await client.auth.signInWithOAuth({provider,options:{redirectTo:new URL("./rede.html",location.href).href}});if(error)say("Falha no login: "+error.message)}
google.addEventListener("click",()=>oauth("google"));microsoft.addEventListener("click",()=>oauth("azure"));
form.addEventListener("submit",async e=>{e.preventDefault();if(!client)return;submit.disabled=true;say("Processando autenticação…");const email=document.getElementById("email").value.trim(),pass=password.value;try{if(mode==="signup"){const {data,error}=await client.auth.signUp({email,password:pass,options:{emailRedirectTo:new URL("./rede.html",location.href).href}});if(error)throw error;if(data.session)location.replace("./rede.html");else say("Conta criada. Confira seu e-mail para confirmar o cadastro.");}else{const {error}=await client.auth.signInWithPassword({email,password:pass});if(error)throw error;location.replace("./rede.html");}}catch(error){say("Não foi possível concluir: "+error.message)}finally{submit.disabled=false}});
})();
</script></body></html>
