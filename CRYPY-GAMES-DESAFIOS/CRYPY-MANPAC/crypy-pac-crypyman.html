<title>CRYPY — Labirinto Infinito</title>
<style>
:root{--green:#00ff88;--bg:#050907;--panel:#0b1711;--line:#17452e}
*{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 50% 0,#10251a,#030605 65%);color:#d9ffe9;font-family:system-ui,Segoe UI,sans-serif;display:flex;justify-content:center;min-height:100vh;padding:18px}
main{width:min(100%,760px);text-align:center}.brand{color:var(--green);letter-spacing:5px;font-weight:900;font-size:clamp(24px,5vw,42px);text-shadow:0 0 18px #00ff8870;margin:4px 0}.sub{color:#9ccbb0;margin:0 0 14px;font-size:13px;letter-spacing:2px}
.hud{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;background:#09130d;border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:10px;font-weight:700}.hud span{color:var(--green)}
canvas{width:100%;max-width:600px;aspect-ratio:1/1;background:#020503;border:2px solid #167346;border-radius:12px;box-shadow:0 0 28px #00ff8820;display:block;margin:auto;touch-action:none}
.info{font-size:12px;color:#9fc9ad;margin:10px 0}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:10px}
button{background:#0d2417;color:#caffdc;border:1px solid #1d9658;border-radius:9px;padding:10px 16px;font-weight:800;cursor:pointer}button:hover{background:#123c25}
.pad{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,42px);gap:5px;justify-content:center;margin:12px auto}.pad button{padding:0;font-size:18px;touch-action:none}.pad .empty{visibility:hidden}
.overlay{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:20px}.modal{background:#09170f;border:1px solid var(--green);border-radius:16px;padding:24px;max-width:360px;box-shadow:0 0 35px #00ff8840}.modal h2{color:var(--green)}
</style>

const spriteObjects = spriteImgs.map(src => { const im = new Image(); im.src = src; return im; });

const dirs={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
function reset(){
 walls=[];dots=[];powers=[];
 map.forEach((row,y)=>[...row].forEach((v,x)=>{if(v==='#')walls.push([x,y]);else if(v==='.')dots.push([x,y]);else if(v==='o')powers.push([x,y]);}));
 player={x:1,y:1,dir:[0,0],next:[0,0],mouth:0};
 ghosts=[{x:13,y:1,color:'#ff334d',home:[13,1]},{x:13,y:13,color:'#35d8ff',home:[13,13]},{x:1,y:13,color:'#c34dff',home:[1,13]},{x:7,y:1,color:'#ffb52e',home:[7,1]},{x:7,y:13,color:'#ff4fc8',home:[7,13]}];
}
function wall(x,y){return x<0||y<0||x>=N||y>=N||map[y][x]==='#'}
function move(obj,dir){if(!dir)return;let nx=obj.x+dir[0],ny=obj.y+dir[1];if(!wall(nx,ny)){obj.x=nx;obj.y=ny}}
function draw(){
 ctx.clearRect(0,0,600,600);ctx.fillStyle='#020704';ctx.fillRect(0,0,600,600);
 walls.forEach(([x,y])=>{ctx.fillStyle='#082b19';ctx.fillRect(x*C+2,y*C+2,C-4,C-4);ctx.strokeStyle='#00a85b';ctx.lineWidth=1.4;ctx.strokeRect(x*C+5,y*C+5,C-10,C-10)});
 dots.forEach(([x,y])=>{ctx.fillStyle='#9affc5';ctx.beginPath();ctx.arc(x*C+20,y*C+20,3.2,0,Math.PI*2);ctx.fill()});
 powers.forEach(([x,y])=>{ctx.fillStyle='#00ff88';ctx.shadowColor='#00ff88';ctx.shadowBlur=15;ctx.beginPath();ctx.arc(x*C+20,y*C+20,8,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0});
 // CRYPY: cristal verde baseado no emblema enviado
 const heroImg=spriteObjects[0];
 if(heroImg.complete && heroImg.naturalWidth){ctx.save();ctx.translate(player.x*C+20,player.y*C+20);ctx.rotate(Math.atan2(player.dir[1],player.dir[0]));ctx.shadowColor='#00ff88';ctx.shadowBlur=12;ctx.drawImage(heroImg,-21,-21,42,42);ctx.restore();}
 else {ctx.fillStyle='#00ff88';ctx.beginPath();ctx.moveTo(player.x*C+20,player.y*C+4);ctx.lineTo(player.x*C+36,player.y*C+20);ctx.lineTo(player.x*C+20,player.y*C+36);ctx.lineTo(player.x*C+4,player.y*C+20);ctx.fill();}
 // Guardiões blindados com núcleo galáctico em cinco cores
 ghosts.forEach((g,i)=>{const enemyImg=spriteObjects[i+1];if(powerTime>0){ctx.globalAlpha=.55;}if(enemyImg && enemyImg.complete && enemyImg.naturalWidth){ctx.save();ctx.shadowColor=g.color;ctx.shadowBlur=10;ctx.drawImage(enemyImg,g.x*C-2,g.y*C-3,44,46);ctx.restore();}else{ctx.fillStyle=g.color;ctx.beginPath();ctx.arc(g.x*C+20,g.y*C+20,15,0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;});
}
function update(dt){
 if(!running||paused)return;
 dt=Math.min(dt,50);
 playerClock+=dt;ghostClock+=dt;uiClock+=dt;
 let changed=false;
 while(playerClock>=420){
  playerClock-=420;
  if(!wall(player.x+player.next[0],player.y+player.next[1]))player.dir=player.next;
  move(player,player.dir);player.mouth++;changed=true;
  const key=(a)=>a[0]===player.x&&a[1]===player.y;
  let i=dots.findIndex(key);if(i>=0){dots.splice(i,1);score+=10}
  i=powers.findIndex(key);if(i>=0){powers.splice(i,1);score+=50;powerTime=5000}
 }
 while(ghostClock>=760){
  ghostClock-=760;
  ghosts.forEach(g=>{
   let choices=Object.values(dirs).filter(d=>!wall(g.x+d[0],g.y+d[1]));
   if(choices.length){
    let target=powerTime>0?g.home:[player.x,player.y];
    choices.sort((a,b)=>{
     let da=Math.abs(g.x+a[0]-target[0])+Math.abs(g.y+a[1]-target[1]);
     let db=Math.abs(g.x+b[0]-target[0])+Math.abs(g.y+b[1]-target[1]);
     return powerTime>0?db-da:da-db;
    });
    move(g,choices[0]);
   }
  });
  changed=true;
 }
 if(powerTime>0)powerTime=Math.max(0,powerTime-dt);
 ghosts.forEach(g=>{
  if(g.x===player.x&&g.y===player.y){
   if(powerTime>0){score+=200;g.x=g.home[0];g.y=g.home[1]}
   else{
    lives--;player.x=1;player.y=1;player.dir=[0,0];player.next=[0,0];
    playerClock=0;
    if(lives<=0)finish(false);
   }
  }
 });
 if(dots.length===0&&powers.length===0){level++;reset();player.x=1;player.y=1;playerClock=0;ghostClock=0}
 if(uiClock>=100){
  uiClock=0;
  document.getElementById('score').textContent=score;
  document.getElementById('lives').textContent=lives;
  document.getElementById('level').textContent=level;
 }
 if(changed)draw();
}
function gameLoop(timestamp){
 if(!lastTick)lastTick=timestamp;
 const dt=timestamp-lastTick;lastTick=timestamp;
 update(dt);
 if(running&&!paused)draw();
 requestAnimationFrame(gameLoop);
}
function finish(win){running=false;document.getElementById('result').textContent=win?'MISSÃO CONCLUÍDA!':'FIM DE JOGO';document.getElementById('message').textContent=win?'Você protegeu o núcleo CRYPY!':'Os guardiões alcançaram o cristal. Tente novamente!';document.getElementById('overlay').style.display='flex'}
function start(){score=0;lives=3;level=1;frame=0;powerTime=0;lastTick=0;playerClock=0;ghostClock=0;uiClock=0;reset();player={x:1,y:1,dir:[0,0],next:[0,0],mouth:0};running=true;paused=false;document.getElementById('overlay').style.display='none';draw()}
function setDir(name){if(dirs[name])player.next=dirs[name]}
document.addEventListener('keydown',e=>{let k=e.key.toLowerCase(),d={arrowup:'up',w:'up',arrowdown:'down',s:'down',arrowleft:'left',a:'left',arrowright:'right',d:'right'}[k];if(d){e.preventDefault();setDir(d)}if(k===' '){paused=!paused}});
document.querySelectorAll('[data-dir]').forEach(b=>{b.addEventListener('pointerdown',e=>{e.preventDefault();setDir(b.dataset.dir)})});
document.getElementById('start').onclick=start;document.getElementById('again').onclick=start;document.getElementById('pause').onclick=()=>paused=!paused;
reset();player={x:1,y:1,dir:[0,0],next:[0,0],mouth:0};draw();requestAnimationFrame(gameLoop);
})();
