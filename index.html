<script>
(function(){
 const launch=document.getElementById('baby-launch');
 const panel=document.getElementById('baby-panel');
 const close=document.getElementById('baby-close');
 function setOpen(open){
   panel.classList.toggle('open',open);
   panel.setAttribute('aria-hidden',String(!open));
   launch.setAttribute('aria-expanded',String(open));
   if(open) close.focus(); else launch.focus();
 }
 launch.addEventListener('click',()=>setOpen(!panel.classList.contains('open')));
 close.addEventListener('click',()=>setOpen(false));
 document.addEventListener('keydown',e=>{if(e.key==='Escape'&&panel.classList.contains('open'))setOpen(false)});
})();
</script>
