<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#020805">
<meta name="description" content="HOME principal CRYPY: Quarteto das Cores, fotos originais, Crypto Bubbles e navegação integrada da Colmeia WEB3.1.">
<title>CRYPY — HOME PRINCIPAL | QUARTETO + COLMEIA</title>
<style>
:root{color-scheme:dark;--g:#00ff88;--bg:#020805;--panel:#06140b;--line:#17643a;--txt:#eafff2;--muted:#9bc9ad}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font:14px/1.45 Arial, sans-serif}
#crypy-home-frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#000}
.cx-launcher{position:fixed;z-index:999999;top:12px;right:12px;display:flex;gap:7px}
.cx-launcher button{border:1px solid var(--g);border-radius:999px;background:#03130a;color:var(--g);padding:10px 14px;font-size:11px;font-weight:900;letter-spacing:.05em;cursor:pointer;box-shadow:0 0 15px #00ff8830}
.cx-launcher button:hover,.cx-launcher button:focus-visible{background:var(--g);color:#001b0c;outline:none}
#cx-panel{position:fixed;z-index:999998;inset:0 0 0 auto;width:min(460px,100vw);height:100dvh;overflow:auto;background:rgba(2,8,5,.97);border-left:1px solid var(--line);box-shadow:-15px 0 45px #000b;padding:18px;transform:translateX(105%);transition:transform .25s ease}
#cx-panel.open{transform:translateX(0)}
.cx-panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.cx-panel-head h1{font-size:19px;line-height:1.15;color:var(--g);margin:0;letter-spacing:.04em}
.cx-panel-head button,.cx-home-btn,.cx-map-btn{border:1px solid var(--line);border-radius:9px;background:#07170d;color:var(--txt);padding:9px 11px;font-weight:800;cursor:pointer}
.cx-home-btn{width:100%;border-color:var(--g);color:var(--g);margin-bottom:10px}
.cx-map-btn{width:100%;margin-bottom:13px}
.cx-tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.cx-tabs button{min-height:41px;padding:8px;border:1px solid var(--line);border-radius:8px;background:#06170d;color:var(--txt);font-size:10px;font-weight:850;cursor:pointer}
.cx-tabs button[aria-pressed=true],.cx-tabs button:hover{background:var(--g);color:#001b0c;border-color:var(--g)}
#cx-status{font-size:11px;color:var(--muted);margin:14px 0 9px}
#cx-pages{display:grid;gap:7px}
.cx-page{display:block;padding:11px;border:1px solid #17452b;border-radius:8px;background:#06130b;color:var(--txt);text-decoration:none;overflow-wrap:anywhere;font-size:12px}
.cx-page:hover{border-color:var(--g);color:var(--g)}
.cx-page small{display:block;color:#86aa93;font-size:10px;margin-top:4px}
#cx-music{position:fixed;z-index:999997;left:12px;bottom:12px}
#cx-music-toggle{border:1px solid var(--g);border-radius:50%;width:42px;height:42px;background:#03130a;color:var(--g);font-size:19px;cursor:pointer;box-shadow:0 0 14px #00ff8830}
#cx-music-box{display:none;width:min(260px,calc(100vw - 24px));padding:10px;border:1px solid var(--g);border-radius:12px;background:#020b06;box-shadow:0 0 18px #00ff8840}
#cx-music-box.open{display:block}
#cx-music-box iframe{display:block;width:100%;aspect-ratio:16/9;border:0;border-radius:8px;background:#000}
#cx-music-box button{border:1px solid var(--line);border-radius:7px;background:#06180e;color:var(--g);padding:8px;font-size:10px;font-weight:900;cursor:pointer}
#cx-music-box p{color:var(--muted);font-size:10px;margin:7px 0 0}
@media(max-width:520px){.cx-launcher{top:8px;right:8px}.cx-launcher button{padding:9px 11px;font-size:10px}#cx-panel{padding:14px}}
@media(prefers-reduced-motion:reduce){#cx-panel{transition:none}}
</style>
</head>
<body>
<iframe id="crypy-home-frame" src="./index1.htm" title="HOME principal CRYPY — Quarteto das Cores e Crypto Bubbles" allow="autoplay; fullscreen" loading="eager"></iframe>
<div class="cx-launcher">
 <button type="button" id="cx-open" aria-expanded="false" aria-controls="cx-panel">♾️ COLMEIA</button>
 <button type="button" id="cx-home">HOME 1</button>
</div>
<aside id="cx-panel" aria-label="Navegação global da Colmeia">
 <div class="cx-panel-head"><h1>CRYPY · COLMEIA WEB3.1</h1><button type="button" id="cx-close" aria-label="Fechar navegação">✕</button></div>
 <button class="cx-home-btn" type="button" id="cx-home-panel">♾️ VOLTAR À HOME PRINCIPAL</button>
 <button class="cx-map-btn" type="button" id="cx-map">ABRIR MAPA DA COLMEIA</button>
 <div class="cx-tabs" id="cx-tabs">
  <button type="button" data-cx="infinyt" aria-pressed="false">CRYPY-INFINIT</button>
  <button type="button" data-cx="academy" aria-pressed="false">CRYPY-ACADEMY</button>
  <button type="button" data-cx="squad" aria-pressed="false">ESQUADRÃO DAS CORES</button>
  <button type="button" data-cx="nft" aria-pressed="false">NFT-COLLECTION</button>
  <button type="button" data-cx="bio" aria-pressed="false">BIOGRAFIA</button>
  <button type="button" data-cx="news" aria-pressed="false">CRYPY-NEWS</button>
  <button type="button" data-cx="museum" aria-pressed="false">MUSEU DIGITAL</button>
  <button type="button" data-cx="market" aria-pressed="false">MARKETPLACE</button>
  <button type="button" data-cx="games" aria-pressed="false">CRYPY-GAMES</button>
  <button type="button" data-cx="social" aria-pressed="false">CRYPYCUT</button>
  <button type="button" data-cx="baby" aria-pressed="false">BABY I.A.</button>
  <button type="button" data-cx="whitepaper" aria-pressed="false">WHITE PAPER</button>
  <button type="button" data-cx="contact" aria-pressed="false">CONTATO</button>
 </div>
 <p id="cx-status" role="status">Carregando o índice oficial da Colmeia…</p>
 <div id="cx-pages"></div>
</aside>
<div id="cx-music">
 <button type="button" id="cx-music-toggle" aria-label="Abrir trilha sonora CRYPY">♫</button>
 <div id="cx-music-box">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:7px;color:#00ff88;font-weight:900;font-size:11px"><span>CRYPY SOUNDTRACK</span><button type="button" id="cx-music-close">FECHAR</button></div>
  <iframe id="cx-music-frame" title="CRYPY Soundtrack" loading="lazy"></iframe>
  <button type="button" id="cx-music-sound" style="width:100%;margin-top:7px">ATIVAR SOM</button>
  <p>Reprodução opcional; o áudio só inicia após seu clique.</p>
 </div>
</div>
<script>
(function(){
'use strict';
const frame=document.getElementById('crypy-home-frame');
const panel=document.getElementById('cx-panel');
const openBtn=document.getElementById('cx-open');
const status=document.getElementById('cx-status');
const list=document.getElementById('cx-pages');
const cfg={
infinyt:{label:'CRYPY-INFINIT',groups:['crypy-infinyt','marketing']},
academy:{label:'CRYPY-ACADEMY',groups:['crypy-academy','web3.1']},
squad:{label:'ESQUADRÃO DAS CORES',groups:['esquadrao-das-cores']},
nft:{label:'NFT-COLLECTION',groups:['nft-collection']},
bio:{label:'BIOGRAFIA',groups:['biografia']},
news:{label:'CRYPY-NEWS',paths:['crypy-news/index.html']},
museum:{label:'MUSEU DIGITAL',paths:['crypy-news/museu.html']},
market:{label:'MARKETPLACE',groups:['art-figure-marketplace']},
games:{label:'CRYPY-GAMES',groups:['crypy-games-desafios']},
social:{label:'CRYPYCUT',groups:['social-crypykut']},
baby:{label:'BABY I.A.',groups:['RAIZ','baby-ia','memory-boost','padrao','pluguin','sincronizacao']},
whitepaper:{label:'WHITE PAPER',paths:['crypy-coin/white-paper.html']},
contact:{label:'CONTATO',groups:['contato']}
};
let pages=[];
function showPanel(show){panel.classList.toggle('open',show);openBtn.setAttribute('aria-expanded',String(show));}
document.getElementById('cx-open').addEventListener('click',()=>showPanel(!panel.classList.contains('open')));
document.getElementById('cx-close').addEventListener('click',()=>showPanel(false));
function home(){frame.src='./index1.htm';showPanel(false);}
document.getElementById('cx-home').addEventListener('click',home);
document.getElementById('cx-home-panel').addEventListener('click',home);
document.getElementById('cx-map').addEventListener('click',()=>{frame.src='./mapa-colmeia.html';showPanel(false);});
function safe(p){
 if(!p||typeof p.path!=='string')return false;
 const path=p.path,low=path.toLowerCase(),file=low.split('/').pop();
 if(path.startsWith('/')||path.split('/').includes('..')||!(/\.html?$/i.test(path)))return false;
 if(/(^|\/)(hd-oculto|hd-matriz|crypy-server|crypy-server-bridge)(\/|$)/i.test(path))return false;
 if(/^(chatboot-baby-ia|hd-baby-ia|hd-babyia|hd-memory|health|pluguin|pluguins-tuto|relogio-mundial|baby-ia-agente|baby-ia-conectado|baby-agente-cons|auto-config|esquadrao-auto-config)\.html?$/i.test(file))return false;
 return true;
}
function select(key){
 const theme=cfg[key];if(!theme)return;
 document.querySelectorAll('[data-cx]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.cx===key)));
 list.replaceChildren();
 const selected=pages.filter(p=>safe(p)&&((theme.paths&&theme.paths.includes(p.path))||(theme.groups&&theme.groups.includes(p.group))));
 status.textContent=theme.label+' · '+selected.length+' página(s) pública(s) no índice.';
 if(!selected.length){const empty=document.createElement('p');empty.textContent='Nenhuma página pública encontrada para esta área. Nenhum caminho foi inventado.';list.append(empty);return;}
 selected.sort((a,b)=>(a.label||a.path).localeCompare(b.label||b.path,'pt-BR'));
 selected.forEach(p=>{
  const a=document.createElement('a');a.className='cx-page';a.href='./'+p.path;a.textContent=p.label||p.path;a.title=p.path;
  const small=document.createElement('small');small.textContent=p.path;a.append(small);
  a.addEventListener('click',e=>{e.preventDefault();frame.src='./'+p.path;showPanel(false);});
  list.append(a);
 });
}
document.querySelectorAll('[data-cx]').forEach(b=>b.addEventListener('click',()=>select(b.dataset.cx)));
fetch('./assets/data/crypy-page-index.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}).then(data=>{
 if(!Array.isArray(data.pages))throw new Error('Formato do índice inválido');
 pages=data.pages.filter(safe);
 status.textContent='ÍNDICE v'+(data.version||'?')+' · '+pages.length+' páginas públicas filtradas · selecione uma das 13 áreas.';
}).catch(err=>{status.textContent='Índice indisponível: '+err.message+'. A HOME 1 continua funcionando.';});
const musicBox=document.getElementById('cx-music-box'),musicFrame=document.getElementById('cx-music-frame');
const video='8PeU6AVPQVg';let musicLoaded=false;
function musicUrl(muted){return 'https://www.youtube-nocookie.com/embed/'+video+'?autoplay=1&mute='+(muted?'1':'0')+'&loop=1&playlist='+video+'&controls=1&playsinline=1&rel=0';}
document.getElementById('cx-music-toggle').addEventListener('click',()=>musicBox.classList.toggle('open'));
document.getElementById('cx-music-close').addEventListener('click',()=>musicBox.classList.remove('open'));
document.getElementById('cx-music-sound').addEventListener('click',()=>{musicFrame.src=musicUrl(false);musicLoaded=true;});
})();
</script>
</body>
</html>
