<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>CRYPY — Colmeia</title>
<style>
:root{color-scheme:dark;--neon:#00ff88;--bg:#020502;--panel:#07130b;--line:#16472b}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:var(--bg);color:#eafff2;font:14px/1.45 Arial,sans-serif}
body{display:flex;flex-direction:column;min-height:100vh}
nav{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:9px;padding:14px;background:#020702;border-bottom:1px solid var(--line)}
nav button{min-height:48px;padding:8px 6px;border:1px solid #1b5835;border-radius:9px;background:#06140b;color:#dfffea;text-align:center;font-size:11px;font-weight:800;letter-spacing:.025em;cursor:pointer}
nav button:hover,nav button:focus-visible,nav button[aria-pressed="true"]{background:var(--neon);color:#001b0c;border-color:var(--neon);outline:none}
nav small{display:block;font-size:10px;font-weight:600;opacity:.8;margin-top:2px}
#workspace{flex:1;min-height:0;position:relative;background:#000}
#catalog{padding:18px;max-width:1400px;margin:auto}
#catalog h1{color:var(--neon);font-size:clamp(18px,3vw,26px);margin:0 0 5px}
#catalog .meta{color:#9ac9aa;margin:0 0 16px;font-size:12px}
#pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:9px}
.page-link{display:block;padding:11px 12px;border:1px solid #17452b;border-radius:8px;background:var(--panel);color:#eafff2;text-decoration:none;overflow-wrap:anywhere}
.page-link:hover,.page-link:focus-visible{border-color:var(--neon);color:var(--neon);outline:none}
.page-link small{display:block;color:#85a994;font-size:10px;margin-top:4px}
iframe{display:none;width:100%;height:100%;min-height:70vh;border:0;background:#000}
#status{padding:7px 14px;color:#91b49d;background:#030904;border-top:1px solid #10351f;font-size:11px}
@media(max-width:760px){nav{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;padding:9px}nav button{font-size:10px;min-height:44px}#catalog{padding:13px}}
@media(max-width:360px){nav{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* CRYPY SOUNDTRACK — player compacto, recolhível */
#crypy-music{position:fixed;right:14px;bottom:14px;z-index:2147483000;width:278px;max-width:calc(100vw - 20px);padding:10px;border:1px solid #00ff88;border-radius:13px;background:#020b06;color:#eafff2;box-shadow:0 0 18px #00ff8840;font:12px Arial,sans-serif}
#crypy-music .music-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;color:#00ff88;font-weight:800;letter-spacing:.04em}
#crypy-music .music-head span{flex:1}
#crypy-music button{border:1px solid #1b8b50;border-radius:8px;background:#06180e;color:#dfffea;padding:7px 9px;font-size:10px;font-weight:800;cursor:pointer}
#crypy-music button:hover,#crypy-music button:focus-visible{background:#00ff88;color:#001b0c;outline:none}
#crypy-music .music-frame{display:block;width:100%;aspect-ratio:16/9;border:0;border-radius:8px;background:#000}
#crypy-music .music-note{margin-top:6px;color:#9bc9ad;font-size:10px;line-height:1.35}
#crypy-music.is-minimized{width:46px;height:46px;padding:3px;border-radius:50%;overflow:hidden}
#crypy-music.is-minimized .music-head{margin:0;height:40px;justify-content:center}
#crypy-music.is-minimized .music-head span,#crypy-music.is-minimized .music-actions,#crypy-music.is-minimized .music-frame,#crypy-music.is-minimized .music-note{display:none}
#crypy-music.is-minimized #music-expand{display:block;width:40px;height:40px;padding:0;border:0;border-radius:50%;font-size:21px;color:#00ff88;background:#03130a}
#music-expand{display:none}
@media(max-width:600px){#crypy-music{right:9px;bottom:9px;width:260px}#crypy-music.is-minimized{width:44px;height:44px}#crypy-music.is-minimized .music-head{height:38px}#crypy-music.is-minimized #music-expand{width:38px;height:38px}}


/* CRYPY COSMIC RGB — Home visual layer */
:root{--neon:#00ffd0;--bg:#03040c;--panel:#081326;--line:#1a5570}
html,body{background:#03040c url('./assets/images/crypy-cosmos.svg') center/cover fixed no-repeat}
body:before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse at 15% 15%,#00f0ff26,transparent 38%),radial-gradient(ellipse at 85% 30%,#ff26cf24,transparent 36%),radial-gradient(ellipse at 50% 90%,#6d4cff26,transparent 42%);animation:home-cosmos 18s ease-in-out infinite alternate}
body>*{position:relative;z-index:1}
nav#main-menu{background:rgba(2,5,17,.86);backdrop-filter:blur(16px);border-bottom:1px solid transparent;border-image:linear-gradient(90deg,#00ffd0,#00cfff,#ff38c9,#9b5cff,#00ffd0) 1}
nav#main-menu button{position:relative;overflow:hidden;background:linear-gradient(125deg,#07162b,#170d2b,#06232a);border:1px solid #43eaff66;color:#edffff;box-shadow:inset 0 0 18px #00d9ff0b;transition:transform .3s ease,box-shadow .3s ease,border-color .3s ease}
nav#main-menu button:after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent,#ffffff24,transparent);transform:translateX(-130%);transition:transform .65s ease}
nav#main-menu button:hover:after{transform:translateX(130%)}
nav#main-menu button:hover,nav#main-menu button:focus-visible{background:linear-gradient(110deg,#00ffd0,#00d9ff,#ff54d9);color:#06101b;border-color:#fff;box-shadow:0 0 22px #00d9ff66,0 0 34px #ff38c944;transform:translateY(-2px)}
#workspace{background:linear-gradient(135deg,#020611d9,#0b0b20c9,#031b20d9)}
#catalog h1{background:linear-gradient(90deg,#fff,#8ffff0,#7ceaff,#ff9bea,#fff0a6);background-size:250% auto;color:transparent;background-clip:text;-webkit-background-clip:text;animation:home-rgb 9s linear infinite}
.page-link{background:linear-gradient(120deg,#08172bdf,#1b0e2ad9,#06232add);border-color:#55eaff55;box-shadow:inset 0 0 20px #00d9ff0b;transition:transform .25s ease,box-shadow .25s ease}
.page-link:hover,.page-link:focus-visible{border-color:#ff65df;color:#fff;box-shadow:0 0 20px #00d9ff55,0 0 25px #ff38c933;transform:translateY(-2px)}
#status{background:rgba(2,6,17,.92);border-top:1px solid #48eaff66;color:#b9e9ed}
@keyframes home-rgb{to{background-position:250% center}}
@keyframes home-cosmos{from{opacity:.55}to{opacity:1}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

</style>
</head>
<body>
<nav id="main-menu" aria-label="Menu principal CRYPY">
<button type="button" data-theme="infinyt">CRYPY INFINYT</button>
<button type="button" data-theme="nft">NFT-COLLECTION</button>
<button type="button" data-theme="squad">ESQUADRÃO DAS CORES</button>
<button type="button" data-theme="academy">CRYPY ACADEMY-WEB3.1</button>
<button type="button" data-theme="bio">BIOGRAFIA</button>
<button type="button" data-theme="museum">MUSEU DIGITAL</button>
<button type="button" data-theme="art">ART-FIGURE / MARKETPLACE</button>
<button type="button" data-theme="games">CRYPY GAMES-DESAFIO</button>
<button type="button" data-theme="social">SOCIAL-CRYPYKUT</button>
<button type="button" data-theme="baby">BABY I.A.</button>
<button type="button" data-theme="whitepaper">WHITE PAPER</button>
<button type="button" data-theme="contact">CONTATO</button>
<button type="button" data-map>MAPA DA COLMEIA</button>
</nav>
<main id="workspace">
<section id="catalog" aria-live="polite">
<h1>CRYPY — COLMEIA DIGITAL</h1>
<p class="meta">Selecione um dos 12 temas para visualizar todas as páginas correspondentes.</p>
<div id="pages"></div>
</section>
<iframe id="viewer" title="Página selecionada da colmeia" loading="lazy"></iframe>
</main>
<div id="status" role="status">Carregando índice oficial de páginas…</div>
<script src="./assets/js/baby-knowledge-sync.js"></script>
<script src="./baby-ia/esquadrao-auto-config.js"></script>
<script>
(function(){
'use strict';
const INDEX_URL='./assets/data/crypy-page-index.json';
const themes={
infinyt:{label:'CRYPY INFINYT',groups:['crypy-infinyt','marketing']},
nft:{label:'NFT-COLLECTION',groups:['nft-collection']},
squad:{label:'ESQUADRÃO DAS CORES',groups:['esquadrao-das-cores']},
academy:{label:'CRYPY ACADEMY-WEB3.1',groups:['crypy-academy','web3.1']},
bio:{label:'BIOGRAFIA',groups:['biografia']},
museum:{label:'MUSEU DIGITAL',groups:['crypy-news']},
art:{label:'ART-FIGURE / MARKETPLACE',groups:['art-figure-marketplace']},
games:{label:'CRYPY GAMES-DESAFIO',groups:['crypy-games-desafios']},
social:{label:'SOCIAL-CRYPYKUT',groups:['social-crypykut']},
baby:{label:'BABY I.A.',groups:['RAIZ','baby-ia','memory-boost','padrao','pluguin','sincronizacao']},
whitepaper:{label:'WHITE PAPER',groups:['crypy-coin']},
contact:{label:'CONTATO',groups:['contato']}
};
let pages=[];
const status=document.getElementById('status');
const catalog=document.getElementById('catalog');
const viewer=document.getElementById('viewer');
const list=document.getElementById('pages');
function safePath(path){return typeof path==='string'&&!path.startsWith('/')&&!path.split('/').includes('..')&&/\.html?$/i.test(path)}
function isPublicPage(path){
 const file=String(path||'').split('/').pop().toLowerCase();
 const internal=/^(chatboot-baby-ia|hd-baby-ia|hd-babyia|hd-memory|health|pluguin|pluguins-tuto|relogio-mundial|baby-ia-agente|baby-ia-conectado|baby-agente-cons|auto-config|esquadrao-auto-config)\.html?$/.test(file);
 return !internal&&!/^index\.html?$/.test(file);
}
function openTheme(key){
const theme=themes[key];if(!theme)return;
const selected=pages.filter(p=>theme.groups.includes(p.group)&&isPublicPage(p.path)&&safePath(p.path)).sort((a,b)=>(a.label||a.path).localeCompare(b.label||b.path,'pt-BR'));
document.querySelectorAll('[data-theme]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.theme===key)));
viewer.style.display='none';viewer.removeAttribute('src');catalog.style.display='block';
document.querySelector('#catalog h1').textContent=theme.label;
document.querySelector('#catalog .meta').textContent=selected.length+' páginas registradas neste tema. Selecione uma página para abri-la aqui, sem sair da Home.';
list.replaceChildren();
if(!selected.length){const p=document.createElement('p');p.textContent='Esta área está reservada na navegação principal. Os módulos internos permanecem preservados e não são listados aqui.';list.append(p);return;}
selected.forEach(page=>{
const a=document.createElement('a');a.className='page-link';a.href='./'+page.path;a.textContent=page.label||page.path;a.title=page.path;
const small=document.createElement('small');small.textContent=page.path;a.append(small);
a.addEventListener('click',function(e){e.preventDefault();viewer.src='./'+page.path;catalog.style.display='none';viewer.style.display='block';});
list.append(a);
});
}
document.querySelectorAll('[data-theme]').forEach(b=>b.addEventListener('click',()=>openTheme(b.dataset.theme)));
document.querySelector('[data-map]').addEventListener('click',()=>{window.location.href='./mapa-colmeia.html';});
fetch(INDEX_URL,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}).then(data=>{
if(!Array.isArray(data.pages))throw new Error('Formato de índice inválido');
pages=data.pages.filter(p=>p&&safePath(p.path)&&p.group);
Object.entries(themes).forEach(([key,theme])=>{
const count=pages.filter(p=>theme.groups.includes(p.group)&&isPublicPage(p.path)).length;
const button=document.querySelector('[data-theme="'+key+'"]');
const small=document.createElement('small');small.textContent=count+' páginas';button.append(small);
});
const assigned=Object.values(themes).reduce((n,t)=>n+pages.filter(p=>t.groups.includes(p.group)).length,0);
const unassigned=pages.filter(p=>!Object.values(themes).some(t=>t.groups.includes(p.group))).length;
status.textContent='PORTAL CRYPY ATIVO · 12 ÁREAS · conteúdo técnico e arquivos internos preservados fora da navegação pública · índice v'+(data.version||'?');
}).catch(err=>{status.textContent='Não foi possível carregar o índice oficial: '+err.message+'. Nenhuma lista foi inventada.';});
})();
</script>

<section id="crypy-music" class="is-minimized" aria-label="Música do portal CRYPY">
  <div class="music-head">
    <span>♫ BAD TIMES · IMAEL ANGEL</span>
    <div class="music-actions">
      <button type="button" id="music-sound">ATIVAR SOM</button>
      <button type="button" id="music-minimize" aria-label="Minimizar player">—</button>
    </div>
    <button type="button" id="music-expand" aria-label="Abrir música" title="Abrir música">♫</button>
  </div>
  <iframe class="music-frame" id="music-frame" title="Bad Times — Imael Angel"
    allow="autoplay; encrypted-media; picture-in-picture; web-share"
    referrerpolicy="strict-origin-when-cross-origin"
    src="about:blank"></iframe>
  <div class="music-note" id="music-note">Trilha oficial do portal. Ative o som após abrir o player; use os controles do vídeo para pausar e ajustar o volume.</div>
</section>
<script>
(function(){
  var dock=document.getElementById('crypy-music');
  var frame=document.getElementById('music-frame');
  var sound=document.getElementById('music-sound');
  var minimize=document.getElementById('music-minimize');
  var expand=document.getElementById('music-expand');
  var note=document.getElementById('music-note');
  var video='8PeU6AVPQVg';
  var loaded=false;
  function playerUrl(muted){
    return 'https://www.youtube-nocookie.com/embed/'+video+
      '?autoplay=1&mute='+(muted?'1':'0')+'&loop=1&playlist='+video+
      '&controls=1&playsinline=1&rel=0';
  }
  function openPlayer(){
    dock.classList.remove('is-minimized');
    if(!loaded){frame.src=playerUrl(true);loaded=true;}
  }
  expand.addEventListener('click',openPlayer);
  minimize.addEventListener('click',function(){dock.classList.add('is-minimized');});
  sound.addEventListener('click',function(){
    frame.src=playerUrl(false);
    loaded=true;
    sound.textContent='SOM ATIVADO';
    note.textContent='Bad Times — Imael Angel · reprodução em loop. O som pode depender da permissão do navegador.';
  });
})();
</script>

<script defer src="assets/js/crypy-global-nav.js"></script>
</body>
</html>
