<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CRYPYVERSE - NFTGAME | HTML Puro - 31 Páginas</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:#050508;color:#fff}
header{position:sticky;top:0;z-index:10;background:rgba(5,5,8,.92);border-bottom:1px solid #222;padding:12px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.logo{font-weight:900;font-size:22px} .logo span{background:linear-gradient(90deg,#8B5CF6,#00E5FF,#00FF88);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.badge{background:#111;border:1px solid #333;padding:6px 10px;border-radius:999px;font-size:13px}
.badge b{color:#00FF88}
input{flex:1;min-width:180px;background:#111;border:1px solid #333;color:#fff;padding:10px 12px;border-radius:10px}
.wrap{display:grid;grid-template-columns:300px 1fr;min-height:100vh}
nav{background:#0A0A12;border-right:1px solid #1e1e2e;padding:14px;overflow:auto}
nav h3{font-size:12px;letter-spacing:.15em;color:#888}
.folder{border:1px solid #222;border-radius:12px;margin:8px 0;overflow:hidden}
.folder>button{width:100%;text-align:left;background:#12121d;color:#fff;border:0;padding:10px;cursor:pointer;font-weight:700}
.folder>button small{color:#00E5FF}
.sub{display:none;padding:6px}
.sub button{display:block;width:100%;text-align:left;background:transparent;color:#ccc;border:0;padding:8px 10px;cursor:pointer;border-radius:8px}
.sub button:hover,.sub button.active{background:#1e1e35;color:#fff}
.open .sub{display:block}
main{padding:22px}
.hero{border:1px solid #2a2a3f;border-radius:20px;padding:22px;background:linear-gradient(135deg,#12081f,#041a1f,#03150c)}
.hero h1{font-size:38px;line-height:1.05;margin:8px 0}
.hero h1 span{background:linear-gradient(90deg,#8B5CF6,#00E5FF,#00FF88);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin:16px 0}
.card{background:#11111c;border:1px solid #2a2a3f;border-radius:16px;padding:14px}
.card .thumb{height:120px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:38px;background:linear-gradient(135deg,#2a0a4a,#083a4a)}
.tag{display:inline-block;font-size:11px;padding:4px 8px;border-radius:999px;background:#00FF88;color:#000;font-weight:800}
.tag.epico{background:#8B5CF6;color:#fff}.tag.lendario{background:#FFB800;color:#000}.tag.mitico{background:#FF2D78;color:#fff}
.btn{background:linear-gradient(90deg,#8B5CF6,#00E5FF);border:0;color:#000;font-weight:800;padding:10px 14px;border-radius:999px;cursor:pointer}
.btn2{background:#1e1e35;color:#fff;border:1px solid #333;padding:10px 14px;border-radius:999px;cursor:pointer}
table{width:100%;border-collapse:collapse;background:#0f0f18;border-radius:12px;overflow:hidden}th,td{padding:10px;border-bottom:1px solid #222;text-align:left;font-size:14px}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.kpi div{background:#11111c;border:1px solid #222;border-radius:14px;padding:14px}
.kpi b{font-size:20px;color:#00FF88}
section{margin:24px 0}h2{font-size:26px}h3{color:#00E5FF}
.pill{display:inline-block;background:#1a1a2a;border:1px solid #333;padding:6px 10px;border-radius:999px;font-size:12px;margin:3px}
footer{padding:20px;color:#888;font-size:13px}
@media(max-width:820px){.wrap{grid-template-columns:1fr}nav{max-height:320px}}
</style></head><body>
<header><div class="logo">CRYPYVERSE <span>NFTGAME</span></div><div class="badge">💰 Saldo Banco: <b id="saldoTopo">1.000.000.000.000.000 CMG</b></div><input id="busca" placeholder="Buscar nas 93 seções... Ex: banco, terreno, RA, profissão"><button class="btn" onclick="alert('Carteira conectada (simulada)')"><a href="./crypy-land-cidade-viva.html" style="display:inline-block;background:#00ff88;color:#00190c;font-weight:900;padding:10px 14px;border-radius:999px;text-decoration:none">🏙️ Abrir Cidade Viva</a>Conectar Carteira</button></header>
<div class="wrap"><nav><h3>MENU DO GAME • 31 PÁGINAS • 31x3 = 93 SEÇÕES</h3><div id="menu"></div><div style="margin-top:14px"><b>Banco Central</b><p style="color:#ccc;font-size:13px">1 quadrilhão CMG depositado. Protótipo / design com blockchain simulada.</p></div></nav>
<main id="main"></main></div>
<script>
const pages=[
["1. Capa",["1.1 Visão","1.2 Como Jogar em 5 min","1.3 Requisitos e Óculos RA"]],
["2. Lore",["2.1 História da Cidade Crypy","2.2 Facções e Distritos","2.3 Linha do Tempo"]],
["3. Mapa",["3.1 Mapa Completo","3.2 Distritos e Zonas","3.3 Lotes Vazios"]],
["4. Terrenos NFT",["4.1 Tipos","4.2 Raridades","4.3 NFT do Terreno"]],
["5. Compra",["5.1 Passo a Passo","5.2 Leilão","5.3 Compra com Óculos RA"]],
["6. Venda",["6.1 Revenda","6.2 Taxas e Royalties","6.3 Histórico de Preços"]],
["7. Construção",["7.1 Editor de Lote","7.2 Materiais e Custos","7.3 Blueprints NFT"]],
["8. Marketplace",["8.1 Vitrine","8.2 Filtros","8.3 Ofertas e Negociação"]],
["9. CRYPY-MONEY-GAME",["9.1 Tokenomics 1 Quadrilhão","9.2 Distribuição e Queima","9.3 Conversão"]],
["10. Banco Crypy",["10.1 Abrir Conta","10.2 Depósito e Saque","10.3 Empréstimo"]],
["11. Sistema Bancário",["11.1 Juros e Cofre","11.2 Extrato Simulado","11.3 Cartão Crypy"]],
["12. Carteira Blockchain",["12.1 Criar Carteira","12.2 Enviar/Receber","12.3 Segurança"]],
["13. Profissões Geral",["13.1 Lista 18 Profissões","13.2 Como Escolher","13.3 Trocar de Profissão"]],
["14. Prof. Comércio",["14.1 Lojista / Restaurante","14.2 Corretor de Terrenos","14.3 Designer"]],
["15. Prof. Públicas",["15.1 Bombeiro / Polícia","15.2 Médico / Professor","15.3 Entregador / Motorista"]],
["16. Carreira",["16.1 XP e Níveis","16.2 Salário e Promoção","16.3 Certificados NFT"]],
["17. Vida Social Amigos",["17.1 Amigos e Casas","17.2 Festas","17.3 Família no Game"]],
["18. Vida Social Pública",["18.1 Praças","18.2 Eventos e Shows","18.3 Clubes e Guildas"]],
["19. Economia Jogador",["19.1 Renda Passiva","19.2 Aluguel","19.3 Impostos"]],
["20. Negócios",["20.1 Abrir Loja","20.2 Contratar","20.3 Lucro e Gestão"]],
["21. Óculos RA Geral",["21.1 Dispositivos","21.2 Calibragem","21.3 Gestos"]],
["22. Óculos RA Compra",["22.1 Ver Terreno na Rua Real","22.2 Comparar Preços em RA","22.3 Assinar em RA"]],
["23. Óculos RA Construção",["23.1 Pré-visualizar Casa","23.2 Decorar em RA","23.3 Compartilhar Projeto"]],
["24. HUD e Rotina",["24.1 HUD Completo","24.2 Necessidades","24.3 Rotina Diária"]],
["25. Avatar",["25.1 Criação","25.2 Roupas NFT","25.3 Acessórios RA"]],
["26. Eventos",["26.1 Temporadas","26.2 Missões Diárias","26.3 Torneios"]],
["27. Governança DAO",["27.1 Votação","27.2 Propostas","27.3 Tesouro DAO"]],
["28. Blockchain e Segurança",["28.1 Como Funciona","28.2 Contratos Inteligentes","28.3 Anti-Fraude"]],
["29. Roadmap",["29.1 Fase 1 Lançamento","29.2 Fase 2 RA e Mobile","29.3 Fase 3 Metaverso"]],
["30. Monetização",["30.1 Modelo Sustentável","30.2 Passe e VIP","30.3 Criadores Ganham"]],
["31. Menu Completo",["31.1 Mapa do Menu 31x3","31.2 Fluxo do Jogador","31.3 Começar Agora"]]];
let saldo=1000000000000000;
let current={p:0,s:0};
function fmt(n){return n.toLocaleString('pt-BR')}
function renderMenu(){
  const m=document.getElementById('menu'); m.innerHTML='';
  pages.forEach((p,pi)=>{
    const d=document.createElement('div'); d.className='folder'+(pi===current.p?' open':'');
    d.innerHTML=`<button onclick="this.parentElement.classList.toggle('open')">${p[0]} <small>• 3 subpastas</small></button><div class="sub"></div>`;
    const sub=d.querySelector('.sub');
    p[1].forEach((s,si)=>{ const b=document.createElement('button'); b.textContent=s; if(pi===current.p&&si===current.s)b.className='active'; b.onclick=()=>{current={p:pi,s:si}; renderMenu(); renderPage(); window.scrollTo(0,0)}; sub.appendChild(b); });
    m.appendChild(d);
  });
}
function renderPage(){
  const p=pages[current.p]; const total=current.p*3+current.s+1;
  let extra='';
  if(current.p===8){ extra=`<section><h3>💰 Simulador Banco</h3><div class="kpi"><div>Saldo Banco Central<b>${fmt(saldo)} CMG</b></div><div>Seu Saldo<b id="meuSaldo">0 CMG</b></div><div>Taxa Juros<b>2,5% / mês simulado</b></div></div><p><input id="valor" type="number" placeholder="Valor em CMG" style="max-width:280px"> <button class="btn" onclick="depositar()">Depositar</button> <button class="btn2" onclick="sacar()">Sacar</button></p><div id="extrato"></div></section>`; }
  if(current.p===3||current.p===7){ extra=`<section><h3>🛒 Simulador Compra Terreno</h3><p>Distrito: <select id="dist"><option>Centro - 250.000 CMG</option><option>Residencial - 90.000 CMG</option><option>Praia - 480.000 CMG</option><option>Cyberpunk - 720.000 CMG</option><option>Condomínio Luxo - 1.200.000 CMG</option></select> <button class="btn" onclick="comprar()">Comprar NFT</button></p><div id="nftGerado"></div></section>`; }
  document.getElementById('main').innerHTML=`
  <div class="hero"><span class="pill">HTML PURO • 1 ARQUIVO • SEM SERVIDOR</span> <span class="pill">PÁGINA ${current.p+1} / 31 • SEÇÃO ${total} / 93</span><h1>CRYPYVERSE<br><span>NFTGAME</span></h1><p style="color:#ddd;max-width:700px">Game NFT de compra e venda de terreno, vida social, profissões e óculos RA. Moeda oficial <b>CRYPY-MONEY-GAME (CMG)</b> • Supply: <b>1 quadrilhão</b> no Banco Crypy. Modelo blockchain simulado / protótipo de design.</p>
  <p><span class="pill">Inspirado nas referências: Cidade Viva</span><span class="pill">Mapa Aéreo</span><span class="pill">Escritório / HUD</span><span class="pill">Praça Nuri</span><span class="pill">Editor de Lote</span><span class="pill">RA Holográfico</span></p>
  <p><button class="btn" onclick="prev()">← Anterior</button> <button class="btn2" onclick="next()">Próxima →</button> <span style="margin-left:10px">${total}/93 • ${Math.round(total/93*100)}%</span></p></div>
  <section><h2>${p[0]}</h2><h3>${p[1][current.s]}</h3><p style="color:#ccc">Conteúdo completo desta subpasta. Nesta página você joga, gerencia e constrói. Use o menu lateral para navegar entre as 31 páginas e as 3 subpastas de cada uma. Todo o sistema está interligado: Terreno → Construção → Negócio → Profissão → Banco → Vida Social → RA.</p></section>
  ${extra}
  <section><h3>🏙️ Terrenos NFT em Destaque</h3><div class="grid">
  <div class="card"><div class="thumb">🏠</div><b>Lote Residencial #0421</b><br><span class="tag">RARO</span> <span style="color:#888">Coleção Bairro</span><p><b>90.000 CMG</b> • +12% 7d</p><button class="btn" onclick="comprar()">Comprar</button></div>
  <div class="card"><div class="thumb">🏢</div><b>Centro Comercial #0012</b><br><span class="tag epico">ÉPICO</span><p><b>250.000 CMG</b> • +8% 7d</p><button class="btn" onclick="comprar()">Comprar</button></div>
  <div class="card"><div class="thumb">🏖️</div><b>Praia Premium #0007</b><br><span class="tag lendario">LENDÁRIO</span><p><b>480.000 CMG</b> • +21% 7d</p><button class="btn" onclick="comprar()">Comprar</button></div>
  <div class="card"><div class="thumb">🌃</div><b>Cyberpunk Tower #0001</b><br><span class="tag mitico">MÍTICO</span><p><b>720.000 CMG</b> • +34% 7d</p><button class="btn" onclick="comprar()">Comprar</button></div>
  </div></section>
  <section><h3>📊 Sistema Financeiro</h3><table><tr><th>Item</th><th>Valor</th><th>Onde</th></tr><tr><td>Supply Total CMG</td><td>1.000.000.000.000.000</td><td>Banco Central</td></tr><tr><td>Terreno Comum</td><td>25.000 CMG</td><td>Marketplace</td></tr><tr><td>Salário Inicial</td><td>4.500 CMG / mês</td><td>Profissões</td></tr><tr><td>Aluguel Médio</td><td>1.200 CMG / mês</td><td>Economia</td></tr></table></section>
  <section><h3>💼 Profissões (18)</h3><p><span class="pill">Corretor de Terrenos</span><span class="pill">Lojista</span><span class="pill">Dono de Restaurante</span><span class="pill">Bombeiro</span><span class="pill">Policial</span><span class="pill">Médico</span><span class="pill">Professor</span><span class="pill">Designer</span><span class="pill">Entregador</span><span class="pill">Motorista</span><span class="pill">Engenheiro RA</span><span class="pill">Prefeito / DAO</span></p></section>
  <section><h3>🥽 Óculos RA</h3><p>Na rua real, com óculos RA você vê o terreno em holograma azul, compara preço, assina contrato e pré-visualiza a casa antes de construir. Gestos: pinça para comprar, arrastar para decorar.</p></section>
  <footer>CRYPYVERSE NFTGAME • HTML Puro • 31 páginas • 31x3 = 93 seções • CRYPY-MONEY-GAME 1 quadrilhão • Protótipo / design com blockchain simulada — não é mintagem real em mainnet.</footer>`;
}
let meu=0;
function depositar(){let v=parseInt(document.getElementById('valor').value||0); if(v>0){meu+=v; saldo-=v; document.getElementById('meuSaldo').textContent=fmt(meu)+' CMG'; document.getElementById('saldoTopo').textContent=fmt(saldo)+' CMG'; document.getElementById('extrato').innerHTML+=`<p>✅ Depósito +${fmt(v)} CMG</p>`}}
function sacar(){let v=parseInt(document.getElementById('valor').value||0); if(v>0&&meu>=v){meu-=v; saldo+=v; document.getElementById('meuSaldo').textContent=fmt(meu)+' CMG'; document.getElementById('saldoTopo').textContent=fmt(saldo)+' CMG'; document.getElementById('extrato').innerHTML+=`<p>💸 Saque -${fmt(v)} CMG</p>`}}
function comprar(){let id=Math.floor(Math.random()*9000)+1000; document.getElementById('nftGerado').innerHTML=`<div class="card" style="margin-top:10px">🎉 NFT Cunhado! <b>CRYPY-LAND #${id}</b> • Registrado na blockchain simulada • Hash: 0xCRYPY${id} • Salvo no seu inventário.</div>`}
function prev(){if(current.s>0)current.s--; else if(current.p>0){current.p--; current.s=2} renderMenu(); renderPage()}
function next(){if(current.s<2)current.s++; else if(current.p<30){current.p++; current.s=0} renderMenu(); renderPage()}
document.getElementById('busca').addEventListener('input',e=>{let q=e.target.value.toLowerCase(); if(q.length>2){let found=null; pages.forEach((p,pi)=>p[1].forEach((s,si)=>{if(s.toLowerCase().includes(q)&&!found)found={p:pi,s:si}})); if(found){current=found; renderMenu(); renderPage();}}});
renderMenu(); renderPage();
</script></body></html>
