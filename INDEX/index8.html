<script>
(function(){
 const frame=document.getElementById('page-frame');
 const open=document.getElementById('open-page');
 const status=document.getElementById('page-status');
 // OCULTAÇÃO TEMPORÁRIA DO CHATBOT FLUTUANTE: observa também widgets inseridos após o carregamento.
 function hideFloatingChat(){
  try{
   const doc=frame.contentDocument;
   if(!doc) return;
   const hide=()=>{
    const root=doc.getElementById('crypy-baby-global-root');
    if(root){root.style.setProperty('display','none','important');root.setAttribute('aria-hidden','true');}
    doc.querySelectorAll('#crypy-baby-global-toggle,#crypy-baby-global-panel').forEach(el=>el.style.setProperty('display','none','important'));
   };
   let style=doc.getElementById('crypy-hide-floating-chat');
   if(!style){
    style=doc.createElement('style');
    style.id='crypy-hide-floating-chat';
    style.textContent='#crypy-baby-global-root,#crypy-baby-global-toggle,#crypy-baby-global-panel{display:none!important;visibility:hidden!important;pointer-events:none!important}';
    (doc.head||doc.documentElement).appendChild(style);
   }
   hide();
   if(!doc.__crypyHideChatObserver && doc.documentElement){
    const observer=new MutationObserver(hide);
    observer.observe(doc.documentElement,{childList:true,subtree:true});
    doc.__crypyHideChatObserver=observer;
   }
  }catch(error){
   console.warn('Não foi possível ocultar o widget flutuante nesta página.',error);
  }
 }
 frame.addEventListener('load',hideFloatingChat);
 hideFloatingChat();
 const catalog=JSON.parse(document.getElementById('crypy-page-catalog-data').textContent);
 const links=catalog.map(item=>{const link=document.createElement('a');link.href=item.href;link.dataset.page=item.page;link.textContent=item.label;return link;});
 function selectPage(file,link){
  frame.src=file;
  open.href=file;
  links.forEach(item=>{
   if(item===link) item.setAttribute('aria-current','page');
   else item.removeAttribute('aria-current');
  });
  const label=link?link.textContent.trim():file;
  status.textContent='Área selecionada: '+label;
  frame.title='CRYPY-WEB3.1 — '+label;
  if(location.hash!=='#'+encodeURIComponent(file)) history.replaceState(null,'','#'+encodeURIComponent(file));
 }
 links.forEach(link=>link.addEventListener('click',event=>{
  event.preventDefault();
  selectPage(link.dataset.page,link);
 }));
 const requested=decodeURIComponent(location.hash.slice(1));
 if(requested && links.some(link=>link.dataset.page===requested)){
  const link=links.find(item=>item.dataset.page===requested);
  selectPage(requested,link);
 } else if(links.length){
  const homeLink=links.find(item=>item.dataset.page==='crypy-infinyt/portal.html')||links[0];
  selectPage(homeLink.dataset.page,homeLink);
 }
})();
</script>
