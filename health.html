.text-\[\#c8e8cd\]{

}

.text-black{
  --tw-text-opacity: 1;
  color: rgb(0 0 0 / var(--tw-text-opacity, 1));
}

.text-white{
  --tw-text-opacity: 1;
  color: rgb(255 255 255 / var(--tw-text-opacity, 1));
}

.line-through{
  text-decoration-line: line-through;
}

.opacity-0{
  opacity: 0;
}

.opacity-70{
  opacity: 0.7;
}

.outline-none{
  outline: 2px solid transparent;

}

.filter{

:root{
  --bg:#000000;
  --surface:#030803;
  --surface2:#071208;
  --line:#00ff00;
  --line-dim:#1a5a1a;
  --text:#eaffea;
  --muted:#8fd69a;
  --neon:#00ff00;
  --safe-area-inset-top: env(safe-area-inset-top, 0px);
}

*{
  box-sizing:border-box
}

html{
  background:#000
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace
}

a{
  color:inherit
}

.font-display{
  font-family:'Archivo Black','JetBrains Mono',sans-serif
}

.hatch{
  background-image:repeating-linear-gradient(90deg, rgba(0,255,0,.12) 0 10px, transparent 10px 20px)
}

.scan{
  position:relative;
  overflow:hidden
}

.scan:after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:repeating-linear-gradient(0deg, transparent 0 3px, rgba(0,255,0,.035) 3px 4px)
}

@keyframes floaty{
  0%,100%{
    transform:translateY(0)
  }

  50%{
    transform:translateY(-10px)
  }
}

@keyframes blink{
  0%,60%{
    opacity:1
  }

  61%,100%{
    opacity:.15
  }
}

@keyframes marquee{
  from{
    transform:translateX(0)
  }

  to{
    transform:translateX(-50%)
  }
}

.bubble{
  animation:floaty 3.2s ease-in-out infinite
}

.blink{
  animation:blink 1.1s steps(1) infinite
}

.marquee{
  animation:marquee 22s linear infinite;
  white-space:nowrap
}

.no-scrollbar::-webkit-scrollbar{
  display:none
}

.no-scrollbar{
  scrollbar-width:none
}
