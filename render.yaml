services:
  - type: web
    name: crypy-server
    runtime: node
    plan: free
    rootDir: crypy-news/hd-matriz/crypy-server
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: CRYPY_ALLOWED_ORIGINS
        value: "https://cryptoecrypto.github.io"
      - key: CRYPY_API_TOKEN
        sync: false
      - key: CRYPY_SENSEI_TOKEN
        sync: false
