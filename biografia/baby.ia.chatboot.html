<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#000;color:#00ff41;font-family:'Courier New',monospace;overflow:hidden}

#chat{flex:1;overflow-y:auto;margin:14px 0;background:rgba(0,0,0,.82);border:1px solid #00ff41;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 0 22px #00ff4133}

<script>
// MATRIX RAIN
const c=document.getElementById('matrix'),ctx=c.getContext('2d');
function resize(){c.width=innerWidth;c.height=innerHeight} resize(); addEventListener('resize',resize);
const chars='01CRYPYBABYIA<>#$%&*+=アイウエオカキクケコサシスセソ'; const font=16; let cols=Math.floor(innerWidth/font); let drops=Array(cols).fill(1);
setInterval(()=>{ctx.fillStyle='rgba(0,0,0,0.08)';ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle='#00ff41';ctx.font=font+'px monospace';for(let i=0;i<drops.length;i++){const t=chars[Math.floor(Math.random()*chars.length)];ctx.fillText(t,i*font,drops[i]*font);if(drops[i]*font>c.height&&Math.random()>.975)drops[i]=0;drops[i]++}},33);

// CHAT
const chat=document.getElementById('chat');
function hora(){return new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}
function add(texto,quem){const d=document.createElement('div');d.className='msg '+quem;d.innerHTML=texto.replace(/\n/g,'<br>')+`<span class="time">${quem==='bot'?'BABY I.A. • ': 'VOCÊ • '}${hora()}</span>`;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d}
function responder(pergunta){
 const p=pergunta.toLowerCase();
 let r='';
 if(p.includes('quem')&&p.includes('você')||p.includes('quem e voce')||p.includes('quem é você')) r='🤖 Oi! Eu sou o BABY I.A. — o chat bot oficial do CRYPY.\n\nFui criado pra te guiar dentro do portal: INFINYT, ACADEMY, MUSEU, GAMES, CRYPYKUT e tudo mais.\n\nPode perguntar o que quiser!';
 else if(p.includes('crypy')) r='💚 CRYPY é o nosso universo!\n\nINFINYT • ACADEMY WEB3.1 • MUSEU DIGITAL • ART-FIGURE • GAMES • CRYPYKUT • WHITE PAPER • CONTATO\n\nQual você quer abrir primeiro?';
 else if(p.includes('portal')||p.includes('menu')||p.includes('link')) r='🔗 PORTAL CRYPY — 9 SEÇÕES:\n\n1. CRYPY INFINYT\n2. ACADEMY WEB3.1\n3. BIOGRAFIA\n4. MUSEU DIGITAL\n5. ART-FIGURE / MARKETPLACE\n6. GAMES - DESAFIO\n7. SOCIAL - CRYPYKUT\n8. WHITE PAPER\n9. CONTATO\n\nMe fala o número que eu te explico!';
 else if(p.includes('infinyt')) r='♾️ CRYPY INFINYT é o mural infinito do universo CRYPY. Tudo conectado, sem fim, em loop!';
 else if(p.includes('academy')||p.includes('web3')) r='🎓 CRYPY ACADEMY WEB3.1 é onde você aprende sobre Web3, NFT, universo CRYPY e o futuro!';
 else if(p.includes('museu')) r='🏛️ MUSEU DIGITAL é o acervo oficial CRYPY — artes, exposições e história do projeto.';
 else if(p.includes('market')||p.includes('art-figure')||p.includes('figure')) r='🛍️ ART-FIGURE / MARKETPLACE é onde ficam as figuras, colecionáveis e artes do CRYPY.';
 else if(p.includes('game')||p.includes('desafio')) r='🎮 CRYPY GAMES - DESAFIO: jogue, complete desafios e ganhe recompensas no universo CRYPY!';
 else if(p.includes('crypykut')||p.includes('social')) r='💬 SOCIAL - CRYPYKUT é a nossa rede social! Lá você encontra a comunidade CRYPY.';
 else if(p.includes('white')||p.includes('paper')) r='📄 WHITE PAPER é o documento oficial do projeto CRYPY — visão, regras e futuro.';
 else if(p.includes('contato')) r='📩 CONTATO: fala com a equipe CRYPY pelo portal. Quer que eu te leve pra página de contato?';
 else if(p.includes('oi')||p.includes('olá')||p.includes('ola')||p.includes('e ai')) r='👋 Oi! Que bom te ver aqui no sistema CRYPY!\n\nEu sou o BABY I.A. — pode perguntar sobre o portal, INFINYT, ACADEMY, MUSEU, GAMES...';
 else if(p.includes('obrigado')||p.includes('valeu')) r='💚 Por nada! Sempre que precisar, é só chamar. O sistema CRYPY está sempre online pra você!';
 else r='🤖 Entendi: "'+pergunta+'"\n\nAinda estou aprendendo, mas já sei falar sobre:\nCRYPY • INFINYT • ACADEMY • MUSEU • GAMES • CRYPYKUT • WHITE PAPER • CONTATO\n\nTenta perguntar uma dessas!';
 const t=add('BABY I.A. está digitando...','bot typing'); setTimeout(()=>{t.remove();add(r,'bot')},650);
}
function perguntar(txt){document.getElementById('input').value=txt;enviar(new Event('submit'))}
function enviar(e){if(e)e.preventDefault();const inp=document.getElementById('input');const v=inp.value.trim();if(!v)return;add(v,'user');inp.value='';responder(v)}
add('🤖 BABY I.A. ONLINE.\n\nFala! Eu sou o BABY I.A. do CRYPY.\nFundo preto, verde neon, sistema Matrix ativo. 💚\n\nPergunta o que você quiser sobre o portal!','bot');
</script>
<style>#babyLearnBtn{margin-left:8px;padding:5px 9px;border:1px solid #00ff88;border-radius:99px;background:#07150d;color:#00ff88;font-size:11px;font-weight:800;cursor:pointer}</style>
<script>
(function(){
 var api=String(window.BABY_SITE_API||"").replace(/\\/$/,"");
 var status=document.getElementById("status");
 if(status&&!document.getElementById("babyLearnBtn")){var b=document.createElement("button");b.id="babyLearnBtn";b.textContent="🧠 APRENDER SITE";status.appendChild(b);b.addEventListener("click",async function(){if(!api){status.firstChild.textContent="🔒 Backend HTTPS não configurado. ";return;}b.disabled=true;b.textContent="INDEXANDO...";try{var r=await fetch(api+"/learn",{method:"POST",credentials:"include"});var d=await r.json();if(!r.ok)throw Error(d.error||"falha");status.firstChild.textContent="🧠 Aprendizado concluído: "+d.pages_scanned+" páginas verificadas; "+d.chunks+" blocos indexados. ";b.textContent="ATUALIZAR ÍNDICE";}catch(e){status.firstChild.textContent="⚠️ Não foi possível aprender: "+e.message+". ";b.textContent="TENTAR NOVAMENTE";}finally{b.disabled=false;}});}
 window.enviar=async function(){var q=(inp.value||"").trim();if(!q)return;addMsg(q,"user");inp.value="";esp.classList.remove("on");esp.textContent="";if(api){try{var r=await fetch(api+"/search",{method:"POST",credentials:"include",headers:{"Content-Type":"application/json"},body:JSON.stringify({query:q})});if(r.ok){var d=await r.json();if(d.results&&d.results.length){var ans=d.results.slice(0,3).map(function(x,i){return (i+1)+". "+x.title+"\\n"+x.text.slice(0,650)+"\\nFonte: "+x.url;}).join("\\n\\n");addMsg("Encontrei conhecimento no índice do site CRYPY:\\n\\n"+ans,"baby");return;}}}catch(e){}}
 addMsg(raciocinar(q),"baby");};
})();
</script>

</body></html><script>
(() => {
  const fusos = [
    ['Brasília', 'America/Sao_Paulo'],
    ['UTC', 'UTC'],
    ['LONDRES', 'Europe/London'],
    ['TÓQUIO', 'Asia/Tokyo']
  ];

  const hora = (fuso) => new Intl.DateTimeFormat('pt-BR', {
    timeZone: fuso,
    hour: '2-digit',
    minute: '2-digit',
    second: '2-digit',
    hour12: false
  }).format(new Date());

  const painel = document.createElement('section');
  painel.style.cssText =
    'display:flex;justify-content:space-around;gap:8px;flex-wrap:wrap;' +
    'padding:10px;border:1px solid #00ff41;border-radius:10px;color:#00ff41';

  painel.innerHTML = fusos.map((f,i) =>
    `<div>${f[0]} <b id="baby-time-${i}">--:--:--</b></div>`
  ).join('');

  document.querySelector('header').after(painel);

  function atualizar() {
    fusos.forEach((f,i) => {
      document.getElementById('baby-time-' + i).textContent = hora(f[1]);
    });
  }

  atualizar();
  setInterval(atualizar, 1000);

  const responderOriginal = window.responder;

  window.responder = function(pergunta) {
    if (/hora|horário|horario|relógio|relogio|que dia|data/i.test(pergunta)) {
      const resultado = fusos.map(f => f[0] + ': ' + hora(f[1])).join('\n');
      add('🕒 Consultei o relógio mundial:\n' + resultado, 'bot');
      return;
    }
    return responderOriginal.call(this, pergunta);
  };
})();
</script>
