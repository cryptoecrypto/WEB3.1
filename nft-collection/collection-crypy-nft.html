:root{
  --bg:#050307;
  --surface:#0d0912;
  --surface2:#171021;
  --line:#2d2140;
  --text:#f5f1ff;
  --muted:#b9adcf;
  --purple:#a78bfa;
  --red:#ff2d3a;
  --green:#34ff9e;
  --gold:#facc15
}

*{
  box-sizing:border-box
}

html{
  background:var(--bg)
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:'Space Grotesk',system-ui,sans-serif
}

button,input,textarea{
  font:inherit
}

button{
  cursor:pointer
}

.shell{
  min-height:100vh;
  padding:var(--safe-area-inset-top) 0 0;
  background:radial-gradient(900px 420px at 15% 0%,#2a1245 0%,transparent 55%),radial-gradient(800px 500px at 90% 12%,#2b0a12 0%,transparent 50%),var(--bg);
  overflow-x:clip
}

.topbar{
  position:sticky;
  top:var(--safe-area-inset-top);
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  padding:14px clamp(16px,4vw,44px);
  background:rgba(5,3,7,.88);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line)
}

.brand{
  display:flex;
  align-items:center;
  gap:9px;
  background:none;
  border:0;
  color:var(--text);
  font-family:Cinzel,serif;
  font-weight:900;
  letter-spacing:.14em;
  font-size:19px
}

.brand span{
  font-family:'Space Grotesk';
  font-size:10px;
  letter-spacing:.22em;
  color:var(--muted)
}

.brand-dot{
  width:11px;
  height:11px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 18px var(--green)
}

nav{
  display:flex;
  gap:4px;
  flex-wrap:wrap
}

.nav{
  background:none;
  border:0;
  color:var(--muted);
  padding:8px 11px;
  border-radius:999px;
  font-size:12px;
  font-weight:700;
  letter-spacing:.08em
}

.nav.active,.nav:hover{
  color:#fff;
  background:#221631
}

.settings-btn{
  display:flex;
  align-items:center;
  gap:7px;
  background:#1d1230;
  border:1px solid var(--line);
  color:#fff;
  border-radius:999px;
  padding:9px 13px;
  font-size:12px;
  font-weight:700
}

.crumbs{
  display:flex;
  align-items:center;
  gap:9px;
  flex-wrap:wrap;
  padding:16px clamp(16px,4vw,44px) 4px;
  color:var(--muted);
  font-size:12px;
  letter-spacing:.08em
}

.crumbs button{
  display:flex;
  align-items:center;
  gap:5px;
  background:none;
  border:0;
  color:var(--muted);
  font-weight:700
}

.crumbs strong{
  color:#fff
}

.hero{
  display:grid;
  grid-template-columns:1.15fr .85fr;
  gap:28px;
  padding:28px clamp(16px,4vw,44px) 32px;
  align-items:center
}

.eyebrow{
  color:var(--green);
  font-size:11px;
  letter-spacing:.24em;
  font-weight:700
}

.hero h1,.home-hero h1,.collections h1{
  font-family:Cinzel,serif;
  font-size:clamp(44px,7vw,86px);
  line-height:.92;
  letter-spacing:-.02em;
  margin:14px 0
}

.hero h1 span,.home-hero em{
  color:transparent;
  -webkit-text-stroke:1.5px var(--purple);
  font-style:normal
}

.subtitle{
  color:#fff;
  font-weight:700;
  letter-spacing:.06em
}

.lede{
  color:var(--muted);
  max-width:560px;
  line-height:1.6
}

.hero-actions{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:22px
}

.primary{
  display:flex;
  align-items:center;
  gap:8px;
  background:var(--red);
  border:0;
  color:#fff;
  border-radius:999px;
  padding:13px 18px;
  font-weight:800;
  box-shadow:0 10px 30px #ff2d3a44
}

.ghost{
  display:flex;
  align-items:center;
  gap:8px;
  background:transparent;
  border:1px solid var(--line);
  color:#fff;
  border-radius:999px;
  padding:12px 16px;
  font-weight:700
}

.ghost:hover,.primary:hover{
  filter:brightness(1.15)
}

.hero-visual{
  position:relative;
  min-height:340px;
  border-radius:24px;
  overflow:hidden;
  background:radial-gradient(circle at 50% 38%,#34ff9e33,transparent 48%),radial-gradient(circle at 80% 90%,#a78bfa33,transparent 40%),#120a1e;
  border:1px solid var(--line);
  display:grid;
  place-items:center
}

.hero-visual strong{
  font-family:Cinzel,serif;
  font-size:clamp(54px,8vw,88px);
  letter-spacing:.12em;
  color:rgba(255,255,255,.16);
  position:relative;
  z-index:2
}

.hero-visual>span{
  position:absolute;
  bottom:20px;
  letter-spacing:.3em;
  font-size:11px;
  color:var(--muted)
}

.orb{
  position:absolute;
  width:170px;
  height:170px;
  border-radius:50%;
  background:radial-gradient(circle,#ff2d3a 0%,#6b0f1e 52%,transparent 72%);
  filter:blur(1px);
  animation:pulse 4s ease-in-out infinite
}

.mist{
  position:absolute;
  height:44px;
  border-radius:999px;
  background:linear-gradient(90deg,transparent,#a78bfa88,transparent);
  filter:blur(8px)
}

.m1{
  width:80%;
  top:62%
}

.m2{
  width:65%;
  top:74%
}

.mist2{
  position:absolute;
  inset:0;
  background:linear-gradient(180deg,transparent 55%,rgba(52,255,158,.12))
}

@keyframes pulse{
  50%{
    transform:scale(1.08)
  }
}

.tools{
  padding:8px clamp(16px,4vw,44px) 20px
}

.search{
  display:flex;
  align-items:center;
  gap:10px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:14px;
  padding:13px 15px;
  max-width:720px
}

.search input{
  flex:1;
  background:none;
  border:0;
  outline:0;
  color:#fff
}

.search input::-moz-placeholder{
  color:#7f7396
}

.search input::placeholder{
  color:#7f7396
}

.filters{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:14px
}

.chip{
  background:#150e20;
  border:1px solid var(--line);
  color:var(--muted);
  padding:8px 12px;
  border-radius:999px;
  font-size:12px;
  font-weight:700
}

.chip.active{
  background:var(--green);
  color:#03150c;
  border-color:var(--green)
}

.result{
  color:var(--muted);
  font-size:13px
}

.mural{
  margin:6px clamp(16px,4vw,44px) 28px;
  border:1px solid var(--line);
  border-radius:22px;
  background:linear-gradient(180deg,#150d22,#0a0610);
  padding:18px
}

.mural-head{
  display:flex;
  justify-content:space-between;
  align-items:end;
  gap:14px;
  flex-wrap:wrap
}

.mural-head h2{
  font-family:Cinzel,serif;
  font-size:clamp(24px,4vw,38px);
  margin:8px 0 0
}

.mural-head p{
  color:var(--muted);
  margin:6px 0 0;
  max-width:640px
}

.mural-count{
  font-weight:800;
  color:var(--green);
  white-space:nowrap
}

.mural-grid{
  display:grid;
  grid-template-columns:repeat(8,1fr);
  gap:10px;
  margin-top:16px
}

.mural-item{
  border:1px solid var(--line);
  border-radius:14px;
  overflow:hidden;
  background:#000;
  padding:0;
  text-align:left;
  color:#fff
}

.mural-item .art{
  height:118px
}

.mural-item .art-mood{
  display:none
}

.mural-item b{
  display:block;
  padding:9px 10px 2px;
  font-size:12px;
  line-height:1.2
}

.mural-item small{
  display:block;
  padding:0 10px 10px;
  color:var(--muted);
  font-size:11px
}

.mural-item:hover{
  border-color:var(--green);
  transform:translateY(-2px)
}

.mural-note{
  margin:12px 0 0;
  color:var(--muted);
  font-size:12px;
  line-height:1.5
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
  padding:0 clamp(16px,4vw,44px) 28px
}

.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:20px;
  overflow:hidden;
  display:flex;
  flex-direction:column
}

.card:hover{
  border-color:#4c356f
}

.card-top{
  display:flex;
  justify-content:space-between;
  padding:13px 15px 0;
  font-size:12px;
  font-weight:800;
  letter-spacing:.1em;
  color:var(--muted)
}

.art{
  position:relative;
  height:220px;
  overflow:hidden;
  margin:12px 12px 0;
  border-radius:14px
}

.art svg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block
}

.art-num{
  position:absolute;
  top:10px;
  left:12px;
  z-index:3;
  background:rgba(0,0,0,.62);
  padding:5px 8px;
  border-radius:999px;
  font-size:11px;
  font-weight:800;
  letter-spacing:.1em
}

.art-mood{
  position:absolute;
  left:12px;
  right:12px;
  bottom:34px;
  z-index:3;
  font-size:12px;
  color:#fff;
  text-shadow:0 2px 8px #000
}

.art-tag{
  position:absolute;
  right:12px;
  bottom:10px;
  z-index:3;
  background:rgba(0,0,0,.62);
  padding:4px 8px;
  border-radius:999px;
  font-size:10px;
  letter-spacing:.12em;
  text-transform:uppercase
}

.card-body{
  padding:16px;
  display:flex;
  flex-direction:column;
  gap:8px;
  flex:1
}

.card-tag{
  font-size:11px;
  letter-spacing:.18em;
  color:var(--green);
  font-weight:800
}

.card-body h2{
  font-family:Cinzel,serif;
  font-size:22px;
  line-height:1.1;
  margin:0
}

.card-body p{
  color:var(--muted);
  line-height:1.55;
  font-size:14px;
  flex:1
}

.view-btn{
  margin-top:4px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  width:100%;
  background:#fff;
  color:#0a0610;
  border:0;
  border-radius:12px;
  padding:12px;
  font-weight:800
}

.view-btn:hover{
  background:var(--green)
}

.genesis-sep{
  margin:10px clamp(16px,4vw,44px) 36px;
  border:1px solid #2b3b2e;
  border-radius:22px;
  background:linear-gradient(120deg,#0e1a14,#0e0a18);
  padding:22px
}

.sep-head{
  display:flex;
  justify-content:space-between;
  gap:16px;
  flex-wrap:wrap;
  align-items:center
}

.sep-head h2{
  font-family:Cinzel,serif;
  font-size:32px;
  margin:8px 0
}

.sep-head p{
  color:var(--muted)
}

.sep-head>button{
  display:flex;
  align-items:center;
  gap:8px;
  background:#facc15;
  border:0;
  border-radius:999px;
  padding:12px 16px;
  font-weight:800
}

.genesis-mini{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-top:18px
}

.genesis-mini article{
  background:rgba(0,0,0,.35);
  border:1px solid var(--line);
  border-radius:16px;
  padding:16px
}

.genesis-mini span{
  color:var(--gold);
  font-weight:800;
  font-size:12px
}

.genesis-mini h3{
  margin:8px 0
}

.genesis-mini p{
  color:var(--muted);
  font-size:13px;
  line-height:1.5
}

.genesis-mini button{
  margin-top:12px;
  background:none;
  border:0;
  color:#fff;
  font-weight:800;
  text-decoration:underline
}

.back-row{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  padding:0 clamp(16px,4vw,44px) 30px
}

.genesis-btn{
  background:var(--gold)
}

.home-hero,.collections{
  padding:42px clamp(16px,4vw,44px) 50px
}

.home-hero em{
  font-family:Cinzel,serif
}

.home-actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:22px
}

.home-cards{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  max-width:820px;
  margin-top:28px
}

.home-cards button,.collection-grid button{
  border:1px solid var(--line);
  background:var(--surface);
  color:#fff;
  text-align:left;
  border-radius:18px;
  padding:20px;
  display:block
}

.home-cards b{
  font-size:28px;
  display:block
}

.home-cards span{
  display:block;
  color:var(--muted);
  margin:6px 0 18px
}

.home-cards i{
  font-style:normal;
  color:var(--green);
  font-weight:800
}

.collection-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
  max-width:980px;
  margin-top:28px
}

.collection-card{
  padding:26px!important
}

.collection-card h2{
  font-family:Cinzel,serif;
  font-size:38px;
  line-height:1;
  margin:14px 0
}

.collection-card p{
  color:var(--muted)
}

.collection-card button{
  margin-top:22px!important;
  background:#fff!important;
  color:#111!important;
  border:0!important;
  border-radius:999px!important;
  padding:12px 16px!important;
  font-weight:800
}

.text-btn{
  display:flex;
  align-items:center;
  gap:8px;
  background:none;
  border:0;
  color:#fff;
  margin-top:22px;
  font-weight:800
}

.empty{
  text-align:center;
  padding:50px 20px;
  border:1px dashed var(--line);
  border-radius:20px;
  margin:0 clamp(16px,4vw,44px) 30px
}

.empty button{
  margin-top:12px;
  background:#fff;
  border:0;
  border-radius:999px;
  padding:11px 16px;
  font-weight:800
}

footer{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:18px;
  flex-wrap:wrap;
  padding:24px clamp(16px,4vw,44px);
  border-top:1px solid var(--line);
  color:var(--muted)
}

footer strong{
  font-family:Cinzel,serif;
  color:#fff;
  letter-spacing:.18em
}

footer p{
  margin:4px 0
}

.warning{
  color:#ffd2d2;
  font-size:13px
}

footer button{
  background:none;
  border:1px solid var(--line);
  color:#fff;
  border-radius:999px;
  padding:11px 15px;
  font-weight:700
}

.overlay{
  position:fixed;
  inset:0;
  z-index:50;
  background:rgba(0,0,0,.82);
  display:grid;
  place-items:center;
  padding:18px;
  overflow-y:auto
}

.modal{
  position:relative;
  width:min(920px,100%);
  background:#120b1b;
  border:1px solid var(--line);
  border-radius:22px;
  padding:22px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
  max-height:90vh;
  overflow:auto
}

.modal .art{
  height:100%;
  min-height:300px;
  margin:0
}

.close{
  position:absolute;
  right:14px;
  top:14px;
  z-index:5;
  background:#000;
  border:1px solid var(--line);
  color:#fff;
  border-radius:50%;
  width:38px;
  height:38px;
  display:grid;
  place-items:center
}

.modal-copy h2,.upload-modal h2,.settings-modal h2,.chat-modal h2{
  font-family:Cinzel,serif;
  font-size:34px;
  line-height:1.05;
  margin:10px 0
}

.modal-copy>p,.modal-lede{
  color:var(--muted);
  line-height:1.6
}

.mood-line{
  display:flex;
  gap:7px;
  align-items:center;
  color:var(--green)
}

.modal-actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:18px
}

.modal-actions>button:first-child{
  background:transparent;
  border:1px solid var(--line);
  color:#fff;
  border-radius:999px;
  padding:11px 15px;
  font-weight:700
}

.small{
  padding:11px 15px!important
}

.upload-modal,.settings-modal,.chat-modal{
  display:block;
  max-width:620px
}

.upload-modal label,.chat-modal label{
  display:block;
  margin-top:15px;
  color:var(--muted);
  font-size:13px
}

.upload-modal input,.upload-modal textarea,.chat-modal input,.settings-option{
  width:100%;
  margin-top:7px;
  background:#080510;
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px;
  color:#fff;
  outline:0
}

.upload-modal textarea{
  min-height:90px;
  resize:vertical
}

.inline-msg{
  color:#ffd2d2;
  margin-top:12px
}

.settings-option{
  display:block;
  text-align:left;
  margin-top:10px
}

.settings-option:hover{
  border-color:var(--green)
}

.chat-bubble{
  background:#1d1430;
  border:1px solid var(--line);
  border-radius:14px;
  padding:12px;
  margin-top:12px;
  line-height:1.5
}

.chat-bubble.me{
  background:#12301f;
  margin-left:32px
}

@media(max-width:820px){
  .hero{
    grid-template-columns:1fr
  }

  .grid{
    grid-template-columns:repeat(2,1fr)
  }

  .mural-grid{
    grid-template-columns:repeat(4,1fr)
  }

  .topbar{
    flex-wrap:wrap
  }

  .home-cards,.collection-grid,.genesis-mini{
    grid-template-columns:1fr
  }

  .modal{
    grid-template-columns:1fr
  }
}

@media(max-width:520px){
  .grid{
    grid-template-columns:1fr
  }

  .mural-grid{
    grid-template-columns:repeat(2,1fr)
  }

  .hero h1{
    font-size:48px
  }

  .topbar{
    padding-left:14px;
    padding-right:14px
  }

  .settings-btn{
    font-size:11px
  }

  .modal .art{
    min-height:240px
  }

  .mural-item .art{
    height:92px
  }
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#050307
  }
}
