name: CRYPY Terminal - Validacao

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 12 * * *'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CRYPY-NEWS/hd-matriz/crypy-server
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configuracao Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Testes automatizados existentes
        run: npm test

      - name: Auditoria estrutural
        run: npm run audit

      - name: Inventario do HD MATRIZ do servidor
        run: npm run inventory

      - name: Indexar HD MATRIZ e comprovar aprendizado ASCII
        run: npm run learn:matrix

      - name: Conclusao do workflow
        if: success()
        run: echo "Validacoes tecnicas concluidas. Aguardando aprovacao humana do Sensei."
