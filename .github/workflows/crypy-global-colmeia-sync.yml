name: CRYPY — Sincronização Global da Colmeia

on:
  push:
    branches:
      - feature/crypy-global-colmeia-20261128
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crypy-global-colmeia-sync
  cancel-in-progress: false

jobs:
  synchronize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout da branch de integração
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validar sintaxe JavaScript
        run: |
          node --check scripts/sincronizar-crypy-global.mjs
          node --check scripts/validar-crypy-global.mjs
          node --check assets/js/crypy-global-nav.js
          node --check assets/js/crypy-global-runtime.js
          node --check assets/js/baby-global-chat.js
          node --check assets/js/crypy-global-agent-chat-page.js
          node --check dev/micro-clock.js
          node --check dev/baby-chat-widget.js

      - name: Aplicar menu global nas páginas públicas e índices históricos
        run: node scripts/sincronizar-crypy-global.mjs --apply

      - name: Validar 13 temas, 13 especialistas e backend
        run: node scripts/validar-crypy-global.mjs

      - name: Gravar sincronização na branch de integração
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nenhuma alteração de sincronização pendente."
          else
            git commit -m "chore: aplica menu global aos HTMLs públicos [skip ci]"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
