name: CRYPY — validação da fusão do Esquadrão
on:
  push:
    branches: [feature/crypy-squad-fusion-coverage-pr]
  pull_request:
    branches: [feature/crypy-page-assistants-sync]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validar sintaxe
        run: node --check assets/js/crypy-page-assistant.js && node --check scripts/aplicar-assistentes-crypy.mjs
      - name: Validar cobertura declarada e arquivos
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const m=JSON.parse(fs.readFileSync('assets/data/crypy-squad-coverage.json','utf8')); if(m.covered_count+m.excluded_count!==m.total_html) throw new Error('Contagem não fecha'); for(const x of m.covered){if(!fs.existsSync(x.file)) throw new Error('Página ausente: '+x.file); if(x.method==='script compartilhado injetado'&&!fs.readFileSync(x.file,'utf8').includes('crypy-page-assistant.js')) throw new Error('Assistente ausente: '+x.file);} const bad=m.excluded.filter(x=>!/(^|\\/)(hd-matriz|hd-oculto)(\\/|$)|(^|\\/)(hd-baby-ia|hd-babyia|hd-memory|hd-baby-ia-completo-tudo)\\.html$|(^|\\/)crypy-server\\//i.test(x.file)); if(bad.length) throw new Error('Exclusão não autorizada: '+bad[0].file); console.log('Cobertura:',m.covered_count,'de',m.total_html,'HTML; preservados:',m.excluded_count);"
