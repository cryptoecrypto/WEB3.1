name: CRYPY — sincronização global segura
on:
  push:
    branches: [feature/crypy-home-full-sync-safe]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: crypy-home-full-sync-safe
  cancel-in-progress: false
jobs:
  sync:
    if: github.ref == 'refs/heads/feature/crypy-home-full-sync-safe'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/crypy-home-full-sync-safe
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check scripts/sincronizar-crypy-global.mjs && node --check scripts/validar-crypy-global.mjs && node --check assets/js/crypy-global-nav.js && node --check assets/js/baby-global-chat.js
      - run: node scripts/sincronizar-crypy-global.mjs
      - run: node scripts/validar-crypy-global.mjs
      - name: Commit sincronização
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(crypy): sincroniza menu global preservando HDs"
            git push origin HEAD:feature/crypy-home-full-sync-safe
          fi
