name: CRYPY — validação da sincronização global
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verificar sintaxe
        run: node --check scripts/sincronizar-crypy-global.mjs && node --check scripts/validar-crypy-global.mjs && node --check scripts/auditar-baby-colmeia.mjs && node --check scripts/testar-baby-colmeia-browser.mjs && node --check assets/js/baby-colmeia-observer.js && node --check assets/js/crypy-global-nav.js && node --check assets/js/baby-global-chat.js
      - name: Auditar Colmeia BABY sem alterar páginas
        run: node scripts/auditar-baby-colmeia.mjs --out=artifacts/baby-colmeia-audit.json
      - name: Publicar relatório de auditoria
        uses: actions/upload-artifact@v4
        with:
          name: baby-colmeia-audit
          path: artifacts/baby-colmeia-audit.json
          if-no-files-found: error
      - name: Preparar Chromium para testes de navegador
        run: |
          mkdir -p /tmp/baby-browser
          npm install --prefix /tmp/baby-browser playwright@1.56.1
          npx --prefix /tmp/baby-browser playwright install --with-deps chromium
      - name: Testar todas as páginas HTML no navegador
        env:
          PLAYWRIGHT_MODULE: /tmp/baby-browser/node_modules/playwright
        run: node scripts/testar-baby-colmeia-browser.mjs
      - name: Publicar relatório de navegador
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baby-colmeia-browser
          path: artifacts/baby-colmeia-browser.json
          if-no-files-found: error
      - name: Testar núcleo BABY e política de permissões
        run: node --test crypy-server-bridge/test/
      - name: Simular sincronização sem alterar arquivos
        run: node scripts/sincronizar-crypy-global.mjs
      - name: Validar índice e integração BABY
        run: node scripts/validar-crypy-global.mjs
