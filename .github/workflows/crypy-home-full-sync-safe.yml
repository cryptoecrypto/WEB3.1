name: CRYPY — validação da sincronização global
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verificar sintaxe
        run: node --check scripts/sincronizar-crypy-global.mjs && node --check scripts/validar-crypy-global.mjs && node --check assets/js/crypy-global-nav.js && node --check assets/js/baby-global-chat.js && node --check dev/micro-clock.js
      - name: Testar núcleo BABY e política de permissões
        run: node --test crypy-server-bridge/test/
      - name: Simular sincronização sem alterar arquivos
        run: node scripts/sincronizar-crypy-global.mjs
      - name: Validar índice e integração BABY
        run: node scripts/validar-crypy-global.mjs
