name: CRYPY — sincronização e auditoria global segura
on:
  push:
    branches: [main, "crypy-indexes-home-menu-2026-11"]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verificar sintaxe dos módulos
        run: |
          node --check scripts/sincronizar-crypy-global.mjs
          node --check scripts/validar-crypy-global.mjs
          node --check scripts/auditar-links-colmeia.mjs
          node --check scripts/validar-baby-chat-inline.mjs
          node --check assets/js/crypy-global-nav.js
          node --check assets/js/crypy-global-runtime.js
          node --check assets/js/baby-global-chat.js
          node --check assets/js/baby-research.js
          node --check assets/js/baby-knowledge-sync.js
          node --check dev/micro-clock.js
      - name: Testar núcleo BABY, permissões e pesquisa externa
        run: node --test crypy-server-bridge/test/ CRYPY-13-CHATBOOTS/tests/
      - name: Aplicar sincronização global com proteção das HDs
        run: node scripts/sincronizar-crypy-global.mjs --apply
      - name: Validar scripts inline do BABY
        run: node scripts/validar-baby-chat-inline.mjs
      - name: Validar índice, menu e integração BABY
        run: node scripts/validar-crypy-global.mjs
      - name: Auditar links, âncoras, recursos e controles das páginas catalogadas
        run: node scripts/auditar-links-colmeia.mjs
      - name: Empacotar alterações para aplicação controlada
        if: always()
        run: |
          mkdir -p /tmp/crypy-global-sync/files
          git diff --name-only --diff-filter=ACM -z > /tmp/crypy-global-sync/changed-files.bin
          count=0
          while IFS= read -r -d '' file; do
            [ -f "$file" ] || continue
            mkdir -p "/tmp/crypy-global-sync/files/$(dirname "$file")"
            cp "$file" "/tmp/crypy-global-sync/files/$file"
            printf '%s\\n' "$file" >> /tmp/crypy-global-sync/SYNC_FILES.txt
            count=$((count+1))
          done < /tmp/crypy-global-sync/changed-files.bin
          echo "Arquivos alterados empacotados: $count"
          if [ -f assets/data/crypy-file-index.json ]; then
            mkdir -p /tmp/crypy-global-sync/files/assets/data
            cp assets/data/crypy-file-index.json /tmp/crypy-global-sync/files/assets/data/
          fi
          printf 'Run: %s\nCommit base: %s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > /tmp/crypy-global-sync/INFO.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crypy-global-sync-${{ github.run_id }}
          path: /tmp/crypy-global-sync/
          if-no-files-found: error
          retention-days: 7
