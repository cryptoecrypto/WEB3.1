name: CRYPY repair validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  academy-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check Academy API
        working-directory: crypy-academy/backend
        run: node --check src/server.js

  baby-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run BABY bridge tests
        working-directory: crypy-server-bridge
        run: npm test

  public-home:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure public home is present
        run: |
          test -s index.html
          grep -q '<title>CRYPY INFINYT' index.html
          grep -q 'crypy-academy/academia.html' index.html
