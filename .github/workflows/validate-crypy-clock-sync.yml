name: Validate CRYPY home and clock synchronization
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  home-clock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node --check assets/js/crypy-global-runtime.js
      - run: node --check CRYPY-13-CHATBOOTS/world-clock.js
      - run: node scripts/testar-crypy-clock-sync.mjs
