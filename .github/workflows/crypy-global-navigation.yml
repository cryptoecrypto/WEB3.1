name: CRYPY — Padronizar menu global em todas as páginas

on:
  push:
    branches:
      - feature/baby-chatbot-global-2026-11-19
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crypy-global-navigation-migration
  cancel-in-progress: false

jobs:
  integrate-global-navigation:
    if: github.ref == 'refs/heads/feature/baby-chatbot-global-2026-11-19'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout da branch autorizada
        uses: actions/checkout@v4
        with:
          ref: feature/baby-chatbot-global-2026-11-19

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Conferir sintaxe dos scripts
        run: |
          node --check assets/js/crypy-global-nav.js
          node --check scripts/integrar-menu-global.mjs
          node --check scripts/validar-menu-global.mjs

      - name: Inserir menu e gerar índice de todas as páginas
        run: node scripts/integrar-menu-global.mjs

      - name: Validar cobertura completa
        run: node scripts/validar-menu-global.mjs

      - name: Registrar migração na mesma branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nenhuma alteração pendente; migração já está aplicada."
          else
            git commit -m "feat(navigation): aplica menu global em todas as páginas HTML"
            git push origin HEAD:feature/baby-chatbot-global-2026-11-19
          fi
