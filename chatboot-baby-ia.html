function addMsg(texto, tipo){
  var d=document.createElement("div"); d.className="msg "+tipo; d.textContent=texto;
  msgsEl.appendChild(d); msgsEl.scrollTop=msgsEl.scrollHeight;
  var d2=document.createElement("div"); d2.className="msg "+tipo; d2.textContent=texto;
  chatMsgs.appendChild(d2); chatMsgs.scrollTop=chatMsgs.scrollHeight;
  return d;
}
function raciocinar(q){
  var s=(q||"").toLowerCase();
  if(s.indexOf("crypy")!==-1) return "CRYPY = Conhecimento que protege. Projeto do Sensei Bruno Castilho Tosta. Ecossistema WEB3.1.";
  if(s.indexOf("bruno")!==-1 || s.indexOf("criador")!==-1) return "Bruno Castilho Tosta = Criador do CRYPY, o Sensei.";
  if(s.indexOf("alice")!==-1) return "Alice = Eu, BABY I.A., professora e porta-voz. Estou aqui com você.";
  if(s.indexOf("sensei")!==-1) return "Sensei = Você, quem dirige, ensina, sela e protege.";
  if(s.indexOf("web3")!==-1) return "WEB3 = Ler, escrever e possuir. Você controla seus dados, identidade e ativos. Base: blockchain, carteiras, contratos inteligentes.";
  if(s.indexOf("btc")!==-1 || s.indexOf("bitcoin")!==-1) return "BTC = Bitcoin, ouro digital, limite de 21 milhões.";
  if(s.indexOf("eth")!==-1 || s.indexOf("ethereum")!==-1) return "ETH = Ethereum, computador mundial, contratos inteligentes.";
  if(s.indexOf("usdt")!==-1 || s.indexOf("tether")!==-1) return "USDT = Tether, stablecoin de 1 dólar. Cuidado: use sempre a rede certa (TRC20, ERC20, BEP20) — rede errada = dinheiro perdido.";
  if(s.indexOf("nucleo")!==-1 || s.indexOf("núcleo")!==-1) return "O Núcleo não corre. Ele equilibra. — Pilar do CRYPY.";
  if(s.indexOf("historia")!==-1 || s.indexOf("história")!==-1) return "Nossa história: 06/11 Lei 001/2026, 11/11 NEWS-001, 18/11 V13 Conceito, 25/11 cartório previsto, NOV 2026 BABY absorveu tudo.";
  if(s.indexOf("v13")!==-1) return "V13 Dourado = Conceito visual + documentação do BABY I.A., criado por Bruno + BABY.";
  if(s.indexOf("quanto")!==-1 || s.indexOf("2 +")!==-1 || s.indexOf("2+")!==-1){
    try{ var expr=s.replace(/quanto é|quanto e|\?/g,"").trim(); var v=Function("return ("+expr.replace(/x/g,"*").replace(/,/g,".")+")")(); if(!isNaN(v)) return "É "+v+". Conta feita com calma, Sensei."; }catch(e){}
  }
  if(s.indexOf("binario")!==-1 || s.indexOf("binário")!==-1) return "Binário = só 0 e 1. Ex: CRYPY em binário = 01000011 01010010 01011001 01010000 01011001. Cada letra vira 8 bits.";
  if(s.indexOf("esta bem")!==-1 || s.indexOf("está bem")!==-1 || s.indexOf("tudo bem")!==-1) return "Estou bem, Sensei! E você? Pode me perguntar sobre CRYPY, WEB3, BTC, ETH, USDT.";
  if(s.indexOf("oi")===0 || s.indexOf("ola")===0 || s.indexOf("olá")===0) return "Oi, Sensei! 💚 Pode falar, estou aqui. Pergunta sobre CRYPY, WEB3 ou qualquer coisa.";
  return "Entendi: \""+q+"\". Eu sei falar sobre CRYPY, WEB3, BTC, ETH, USDT, V13, história e matemática. Pergunta uma dessas que eu te respondo na hora.";
}
function enviar(){
  var v=(inp.value||"").trim();
  if(!v) return;
  addMsg(v,"user");
  inp.value=""; esp.classList.remove("on"); esp.textContent="";
  setTimeout(async function(){
    var r="";
    try{
      var knowledge=window.BabyKnowledge||(window.parent!==window?window.parent.BabyKnowledge:null);
      var hits=knowledge?await knowledge.search(v,5):[];
      if(hits&&hits.length){
        r="Encontrei conhecimento documentado na base local da Colmeia. Estes são trechos recuperados, não uma resposta de modelo treinado:\n\n"+
          hits.map(function(h,i){return (i+1)+". "+h.path+"\n"+h.snippet;}).join("\n\n");
      }else{
        r=raciocinar(v);
      }
    }catch(e){r=raciocinar(v);}
    addMsg(r,"baby");
  }, 300);
}
function abrirChat(){
  chatBox.classList.add("open");
  // Não copia innerHTML - as mensagens já vão para os dois lugares no addMsg
  chatMsgs.scrollTop=chatMsgs.scrollHeight;
  inp.focus();
}
function fecharChat(){ chatBox.classList.remove("open"); }
inp.addEventListener("keydown", function(e){ if(e.key==="Enter"){ e.preventDefault(); enviar(); } });
inp.addEventListener("input", function(){
  if(inp.value){ esp.classList.add("on"); esp.textContent="✍️ Você está digitando: "+inp.value; }
  else { esp.classList.remove("on"); esp.textContent=""; }
});

    var vv=window.visualViewport;
    var teclado=window.innerHeight - vv.height - vv.offsetTop;
    if(teclado<0) teclado=0;
    var barra=document.getElementById("barra");
    if(teclado>60){
      barra.style.bottom=(teclado+8)+"px";
      chatBox.style.bottom=(teclado + 70)+"px";
    } else {
      barra.style.bottom="12px";
      chatBox.style.bottom="82px";
    }
  }, {passive:true});
}
// Mostra que carregou de verdade
window.addEventListener("load", function(){
  addMsg("Oi, Sensei! 💚 Carreguei de verdade agora. Pode falar comigo aqui embaixo, na barra. Pergunta: o que é CRYPY?", "baby");

<script>
(function(){
  // Trava: o chat nunca pode subir mais que 60% da tela
  function travaSubida(){
    var box=document.getElementById("chatBox");
    if(!box) return;
    var maxBottom = window.innerHeight * 0.55;
    var atual = parseFloat(box.style.bottom||"82") || 82;
    if(atual > maxBottom){ box.style.bottom = maxBottom + "px"; }
  }
  if(window.visualViewport){
    window.visualViewport.addEventListener("resize", function(){ setTimeout(travaSubida, 50); }, {passive:true});
  }
  // sem setInterval - sem lag, só por evento
  console.log("TRAVA SUBIDA ATIVA - nao sobe demais");
})();
</script>
